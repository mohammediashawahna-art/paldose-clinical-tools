/* ========== PALDOSE PROFESSIONAL UI REFRESH 2026 ========== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Sheet open motion */
.pd-sheet-backdrop.open .pd-sheet {
  animation: pdSheetIn .28s cubic-bezier(.22,1,.36,1);
}
@keyframes pdSheetIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}

/* Tool head title — single line, auto shrink via container */
.pd-tool-head-title h3 {
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
  font-size: clamp(0.85rem, 2.2vw, 1.05rem) !important;
  line-height: 1.3 !important;
  max-width: 100%;
}
.pd-tool-head-title p {
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
  -webkit-line-clamp: 1 !important;
  display: block !important;
}

/* Tool fields grid — desktop multi-column */
#tool-fields {
  display: grid !important;
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  gap: 12px !important;
  align-items: stretch;
}
@media (min-width: 900px) {
  #tool-fields {
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    gap: 14px !important;
  }
}
@media (min-width: 1200px) {
  #tool-fields {
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
  }
}
@media (max-width: 640px) {
  #tool-fields {
    grid-template-columns: 1fr !important;
    gap: 10px !important;
  }
}

/* Full-width for complex radio groups with many options */
#tool-fields > .pd-radio-group.pd-radio-wide,
#tool-fields > .pd-radio-group:has(.pd-radio-grid > :nth-child(4)) {
  grid-column: 1 / -1;
}

/* Numeric / select / text field cards */
#tool-fields > .pd-field {
  margin: 0 !important;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--pd-border);
  background: var(--pd-bg);
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 88px;
  transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
#tool-fields > .pd-field:hover {
  border-color: color-mix(in srgb, var(--pd-green) 35%, var(--pd-border));
  box-shadow: 0 4px 14px rgba(15,23,42,.06);
}
#tool-fields > .pd-field:focus-within {
  border-color: #10b981;
  box-shadow: 0 0 0 3px rgba(16,185,129,.14);
}
#tool-fields > .pd-field label {
  font-size: 11px !important;
  font-weight: 800;
  color: var(--pd-muted);
  margin-bottom: 8px !important;
  letter-spacing: .01em;
}
#tool-fields > .pd-field input,
#tool-fields > .pd-field select {
  width: 100%;
  height: 42px !important;
  border-radius: 10px !important;
  border: 1px solid var(--pd-border) !important;
  background: var(--pd-card) !important;
  color: var(--pd-text) !important;
  font-size: 14px !important;
  font-weight: 700 !important;
  padding: 0 12px !important;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
#tool-fields > .pd-field input:focus,
#tool-fields > .pd-field select:focus {
  border-color: #10b981 !important;
  box-shadow: 0 0 0 2px rgba(16,185,129,.12);
}

/* Yes/No & radio — professional card unit */
#tool-fields > .pd-radio-group {
  margin: 0 !important;
  padding: 12px 14px !important;
  border-radius: 14px !important;
  border: 1px solid var(--pd-border) !important;
  background: var(--pd-bg) !important;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 88px;
  transition: border-color .18s ease, box-shadow .18s ease;
}
#tool-fields > .pd-radio-group:hover {
  border-color: color-mix(in srgb, var(--pd-green) 30%, var(--pd-border));
  box-shadow: 0 4px 14px rgba(15,23,42,.05);
}
#tool-fields > .pd-radio-group legend {
  font-size: 12px !important;
  font-weight: 800 !important;
  color: var(--pd-text) !important;
  margin: 0 0 2px !important;
  padding: 0 !important;
  line-height: 1.35;
  float: none;
  width: 100%;
}
#tool-fields > .pd-radio-group .pd-radio-grid {
  display: grid !important;
  grid-template-columns: 1fr 1fr !important;
  gap: 8px !important;
}
/* More than 2 options → wrap nicely */
#tool-fields > .pd-radio-group .pd-radio-grid:has(> :nth-child(3)) {
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)) !important;
}
.pd-radio-card {
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 6px !important;
  padding: 10px 12px !important;
  min-height: 40px !important;
  border-radius: 11px !important;
  border: 1.5px solid var(--pd-border) !important;
  background: var(--pd-card) !important;
  color: var(--pd-text) !important;
  font-size: 12px !important;
  font-weight: 700 !important;
  line-height: 1.25 !important;
  cursor: pointer;
  text-align: center;
  transition: border-color .16s ease, background .16s ease, color .16s ease, transform .16s ease, box-shadow .16s ease;
  margin: 0 !important;
  position: relative;
}
.pd-radio-card input {
  position: absolute !important;
  opacity: 0 !important;
  pointer-events: none !important;
  width: 0 !important;
  height: 0 !important;
}
.pd-radio-card:hover {
  border-color: color-mix(in srgb, #10b981 50%, var(--pd-border)) !important;
  transform: translateY(-1px);
}
.pd-radio-card:has(input:checked) {
  border-color: #059669 !important;
  background: linear-gradient(135deg, #ecfdf5, #f0fdfa) !important;
  color: #047857 !important;
  box-shadow: 0 0 0 2px rgba(16,185,129,.18), 0 4px 12px rgba(5,150,105,.1) !important;
  font-weight: 800 !important;
}
.dark .pd-radio-card:has(input:checked) {
  background: linear-gradient(135deg, rgba(6,78,59,.55), rgba(15,23,42,.7)) !important;
  border-color: #34d399 !important;
  color: #6ee7b7 !important;
  box-shadow: 0 0 0 2px rgba(52,211,153,.22) !important;
}
.pd-radio-card:focus-within {
  outline: 2px solid #34d399;
  outline-offset: 2px;
}

/* Checkboxes as card-like */
#tool-fields > .pd-check {
  margin: 0 !important;
  min-height: 72px !important;
  padding: 12px 14px !important;
  border-radius: 14px !important;
  border: 1px solid var(--pd-border) !important;
  background: var(--pd-bg) !important;
  font-size: 12px !important;
  font-weight: 700 !important;
  color: var(--pd-text) !important;
  transition: border-color .16s ease, background .16s ease, box-shadow .16s ease;
}
#tool-fields > .pd-check:hover {
  border-color: color-mix(in srgb, #10b981 40%, var(--pd-border));
}
#tool-fields > .pd-check:has(input:checked) {
  border-color: #059669;
  background: linear-gradient(135deg, #ecfdf5, #f0fdfa);
}
.dark #tool-fields > .pd-check:has(input:checked) {
  background: linear-gradient(135deg, rgba(6,78,59,.5), rgba(15,23,42,.65));
  border-color: #34d399;
}

/* Dark mode — force theme variables on all tool chrome */
.dark #tool-fields > .pd-field,
.dark #tool-fields > .pd-radio-group,
.dark #tool-fields > .pd-check {
  background: var(--pd-bg) !important;
  border-color: var(--pd-border) !important;
  color: var(--pd-text) !important;
}
.dark #tool-fields > .pd-field input,
.dark #tool-fields > .pd-field select,
.dark .pd-radio-card {
  background: var(--pd-card) !important;
  color: var(--pd-text) !important;
  border-color: var(--pd-border) !important;
}
.dark .pd-sheet,
.dark .pd-sheet-head,
.dark .pd-sheet-body,
.dark .pd-tool-bottom-bar {
  background: var(--pd-card) !important;
  color: var(--pd-text);
}
.dark .pd-sheet-backdrop {
  background: var(--pd-bg) !important;
}
.dark .pd-result {
  background: linear-gradient(135deg, rgba(6,78,59,.4), rgba(15,23,42,.75)) !important;
  border-color: rgba(52,211,153,.3) !important;
}
.dark .pd-result-value { color: #34d399 !important; }
/* score-box base dark handled without !important so risk states can override */
.dark .pd-field input,
.dark .pd-field select,
.dark .pd-search,
.dark .pd-check,
.dark .pd-radio-card {
  background: var(--pd-card);
  color: var(--pd-text);
  border-color: var(--pd-border);
}

/* Result card polish */
.pd-result {
  border-radius: 18px !important;
  padding: 20px 18px !important;
  transition: background .25s ease, border-color .25s ease, box-shadow .25s ease;
}
.pd-result-value {
  font-size: clamp(1.6rem, 4vw, 2.35rem) !important;
  letter-spacing: -0.02em;
  transition: color .2s ease, transform .2s ease;
}
.pd-result-badge {
  transition: background .2s ease, color .2s ease;
}
.pd-score-box {
  transition: background .25s ease, border-color .25s ease, color .25s ease, box-shadow .25s ease;
}
.pd-score-box #bottom-result-value {
  transition: transform .2s ease;
}
.pd-score-box.score-pulse #bottom-result-value {
  animation: pdScorePulse .35s ease;
}
@keyframes pdScorePulse {
  0% { transform: scale(1); }
  40% { transform: scale(1.06); }
  100% { transform: scale(1); }
}

/* Card hover polish on home */
.pd-cat-card,
.pd-tool-row,
.pd-fav-item,
.pd-recent-item .pd-recent-icon {
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.pd-cat-card:hover,
.pd-tool-row:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(15,23,42,.08);
}
.dark .pd-cat-card:hover,
.dark .pd-tool-row:hover {
  box-shadow: 0 8px 22px rgba(0,0,0,.35);
}

/* Sheet body wider desktop content */
@media (min-width: 768px) {
  .pd-sheet-body {
    padding-left: max(24px, calc((100vw - 1100px) / 2)) !important;
    padding-right: max(24px, calc((100vw - 1100px) / 2)) !important;
  }
  .pd-sheet-head {
    padding-left: max(24px, calc((100vw - 1100px) / 2)) !important;
    padding-right: max(24px, calc((100vw - 1100px) / 2)) !important;
  }
}

/* Bottom score bar */
.pd-tool-bottom-bar {
  backdrop-filter: blur(16px);
}

/* Select options dark */
.dark select option {
  background: #1e293b;
  color: #f8fafc;
}

/* Formula / breakdown readability */
.pd-breakdown, .pd-formula {
  color: var(--pd-text);
}
.dark .pd-formula {
  background: var(--pd-bg) !important;
  color: var(--pd-muted) !important;
}

/* Validation message */
.pd-validation { color: #b91c1c; }
.dark .pd-validation { color: #fca5a5; }

/* External medscape card */
.pd-sheet-body > .pd-result {
  background: var(--pd-bg);
  border: 1px solid var(--pd-border);
}
.dark .pd-sheet-body > .pd-result {
  background: var(--pd-bg) !important;
}


/* ========== PREMIUM CARDS + DARK MODE FIX ========== */

/* Category grid tighter & premium */
.pd-cat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
@media(min-width:768px){
  .pd-cat-grid{grid-template-columns:repeat(3,1fr);gap:14px}
}
@media(min-width:1100px){
  .pd-cat-grid{grid-template-columns:repeat(4,1fr)}
}

/* Base category card — theme aware, no inline light colors */
.pd-cat-card{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 16px;
  border-radius:16px;
  border:1px solid var(--pd-border);
  background:var(--pd-card);
  cursor:pointer;
  min-height:84px;
  box-shadow:0 1px 2px rgba(15,23,42,.04), 0 4px 12px rgba(15,23,42,.03);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
  position:relative;
  overflow:hidden;
  color:var(--pd-text);
}
.pd-cat-card::before{
  content:"";
  position:absolute;
  inset-inline-start:0;
  top:0;bottom:0;
  width:3px;
  background:transparent;
  transition:background .18s ease;
  border-radius:3px 0 0 3px;
}
.pd-cat-card:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 28px rgba(15,23,42,.1);
  border-color:color-mix(in srgb, var(--pd-green) 28%, var(--pd-border));
}
.dark .pd-cat-card{
  background:var(--pd-card);
  border-color:var(--pd-border);
  box-shadow:0 1px 3px rgba(0,0,0,.25), 0 6px 16px rgba(0,0,0,.18);
}
.dark .pd-cat-card:hover{
  box-shadow:0 12px 32px rgba(0,0,0,.4);
  border-color:color-mix(in srgb, #34d399 35%, var(--pd-border));
}

.pd-cat-body{min-width:0;flex:1;text-align:start}
.pd-cat-name{
  font-size:13.5px;
  font-weight:800;
  line-height:1.25;
  color:var(--pd-text);
  letter-spacing:.01em;
}
.pd-cat-count{
  font-size:11px;
  font-weight:600;
  color:var(--pd-muted);
  margin-top:4px;
}
.pd-cat-arrow{
  margin-inline-start:auto;
  opacity:.4;
  font-size:12px;
  color:var(--pd-muted);
  transition:opacity .15s ease, transform .15s ease;
  flex-shrink:0;
}
.pd-cat-card:hover .pd-cat-arrow{opacity:.85}
html[dir=rtl] .pd-cat-card:hover .pd-cat-arrow{transform:translateX(-3px)}
html[dir=ltr] .pd-cat-card:hover .pd-cat-arrow{transform:translateX(3px)}

/* Category icon — elevated pill with soft gradient */
.pd-cat-icon{
  width:48px;
  height:48px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex-shrink:0;
  transition:transform .18s ease, box-shadow .18s ease;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
}
.pd-cat-card:hover .pd-cat-icon{transform:scale(1.06)}

/* Per-category accent (light) */
.pd-cat-card[data-cat="scores"] .pd-cat-icon{background:linear-gradient(145deg,#dbeafe,#eff6ff);color:#2563eb}
.pd-cat-card[data-cat="meds"] .pd-cat-icon{background:linear-gradient(145deg,#d1fae5,#ecfdf5);color:#059669}

/* ========== ICON MICRO-ANIMATIONS ========== */
@media (prefers-reduced-motion: no-preference) {
  /* Gentle float on category icons */
  .pd-cat-icon i{
    display: inline-block;
    animation: pdIconFloat 3.2s ease-in-out infinite;
  }
  .pd-cat-card:nth-child(2n) .pd-cat-icon i{ animation-delay: .4s; }
  .pd-cat-card:nth-child(3n) .pd-cat-icon i{ animation-delay: .8s; }
  .pd-cat-card:nth-child(4n) .pd-cat-icon i{ animation-delay: 1.2s; }
  .pd-cat-card:hover .pd-cat-icon i{
    animation: pdIconPop .45s ease;
  }

  /* Tool row icons — soft pulse on hover */
  .pd-tool-row:hover .pd-tool-icon i{
    animation: pdIconPop .4s ease;
  }
  .pd-tool-icon i{
    display: inline-block;
    transition: transform .2s ease;
  }

  /* Recent rail icons */
  .pd-recent-icon i{
    display: inline-block;
    animation: pdIconFloat 2.8s ease-in-out infinite;
  }
  .pd-recent-item:nth-child(2n) .pd-recent-icon i{ animation-delay: .35s; }
  .pd-recent-item:nth-child(3n) .pd-recent-icon i{ animation-delay: .7s; }
  .pd-recent-item:hover .pd-recent-icon i{
    animation: pdIconPop .4s ease;
  }

  /* Header logo mark */
  .pd-logo-mark{
    animation: pdLogoGlow 4s ease-in-out infinite;
  }

  /* Theme / star header buttons */
  .pd-icon-btn i{
    display: inline-block;
    transition: transform .25s ease;
  }
  .pd-icon-btn:hover i{
    transform: rotate(-12deg) scale(1.08);
  }
  #btn-theme:hover i{
    transform: rotate(20deg) scale(1.1);
  }

  /* Star favorite */
  .pd-star.is-fav i{
    animation: pdStarShine 2.5s ease-in-out infinite;
  }
  .pd-star:hover i{
    animation: pdIconPop .35s ease;
  }

  /* Suggestion icons */
  .pd-suggestion:hover .pd-suggestion-icon i{
    animation: pdIconPop .35s ease;
  }

  /* Sheet close / back */
  .pd-back i, .pd-sheet-head .pd-star i{
    display: inline-block;
    transition: transform .2s ease;
  }
  .pd-back:hover i{ transform: scale(1.1); }

  /* Emergency category — slightly more alert pulse */
  .pd-cat-card[data-cat="emergency"] .pd-cat-icon i{
    animation: pdIconAlert 2.4s ease-in-out infinite;
  }
  .pd-tool-row[data-cat="emergency"] .pd-tool-icon i{
    animation: none;
  }
  .pd-tool-row[data-cat="emergency"]:hover .pd-tool-icon i{
    animation: pdIconPop .4s ease;
  }
}

@keyframes pdIconFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
@keyframes pdIconPop {
  0% { transform: scale(1); }
  40% { transform: scale(1.18); }
  100% { transform: scale(1); }
}
@keyframes pdIconAlert {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: .85; }
}
@keyframes pdStarShine {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); }
  50% { transform: scale(1.06); filter: drop-shadow(0 0 4px rgba(245,158,11,.55)); }
}
@keyframes pdLogoGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(5,150,105,0); }
  50% { box-shadow: 0 0 12px 2px rgba(5,150,105,.25); }
}

.pd-list-header{

.pd-list-back{

/* YES = green, NO = red when selected */
.pd-radio-card:has(input[value="yes"]:checked),
.pd-radio-card:has(input[value="Yes"]:checked){

  .pd-cat-icon{

    height:40px!important;

/* ========== HEADER LOGOS + ACTION ORDER ========== */
.pd-brand-wrap{gap:8px;min-width:0}
.pd-brand-link{text-decoration:none;color:inherit;gap:10px}
.pd-logo-wrap{
  width:40px;height:40px;flex:0 0 40px;
  border-radius:12px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:transparent;
  box-shadow:0 2px 8px rgba(15,23,42,.08);
}
.dark .pd-logo-wrap{box-shadow:0 2px 10px rgba(0,0,0,.35)}
.pd-logo-img{width:40px;height:40px;object-fit:contain;display:block;border-radius:12px}
/* Light logo in light mode, dark logo in dark mode */
.pd-logo-dark{display:none!important}
.pd-logo-light{display:block!important}
.dark .pd-logo-dark{display:block!important}
.dark .pd-logo-light{display:none!important}

/* Hide old letter mark if any leftover */
.pd-logo-mark{display:none!important}

/* Home / back to Paldose */
.pd-home-btn{
  width:40px;height:40px;flex:0 0 40px;
  border-radius:12px;
  border:1px solid var(--pd-border);
  background:var(--pd-bg);
  color:var(--pd-green);
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:15px;
  transition:transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;
}
.pd-home-btn:hover{
  border-color:color-mix(in srgb, var(--pd-green) 45%, var(--pd-border));
  box-shadow:0 4px 12px rgba(5,150,105,.15);
}
.pd-home-btn:active{transform:scale(.92)}
.dark .pd-home-btn{color:#34d399}

/* Header actions order is DOM: lang → theme → fav (fav farthest end in LTR & RTL via margin) */
.pd-header-actions{
  gap:8px!important;
  align-items:center;
}
html[dir=rtl] .pd-header-actions{flex-direction:row}
html[dir=ltr] .pd-header-actions{flex-direction:row}

/* Language toggle — more prominent */
.pd-lang-toggle.pd-lang-toggle-lg{
  border-radius:12px!important;
  padding:3px!important;
  border:1.5px solid var(--pd-border)!important;
  background:var(--pd-bg)!important;
  box-shadow:0 1px 3px rgba(15,23,42,.05);
}
.pd-lang-toggle.pd-lang-toggle-lg button{
  min-width:44px;
  min-height:34px;
  padding:6px 12px!important;
  font-size:12px!important;
  font-weight:800!important;
  border-radius:9px!important;
  color:var(--pd-muted);
}
.pd-lang-toggle.pd-lang-toggle-lg button.active{
  background:#075C3B!important;
  color:#fff!important;
  box-shadow:0 2px 8px rgba(5,150,105,.25);
}
.dark .pd-lang-toggle.pd-lang-toggle-lg button.active{
  background:#069669!important;
  color:#fff!important;
}

/* Theme button — distinctive */
.pd-theme-btn{
  width:42px!important;height:42px!important;
  border-radius:12px!important;
  border:1.5px solid var(--pd-border)!important;
  background:linear-gradient(145deg,var(--pd-bg),var(--pd-card))!important;
  color:#d97706!important;
  box-shadow:0 2px 8px rgba(217,119,6,.12);
  font-size:16px!important;
}
.pd-theme-btn:hover{
  border-color:rgba(217,119,6,.45)!important;
  color:#b45309!important;
  box-shadow:0 4px 12px rgba(217,119,6,.2);
}
.dark .pd-theme-btn{
  color:#fbbf24!important;
  box-shadow:0 2px 10px rgba(251,191,36,.15);
}
.dark .pd-theme-btn:hover{color:#fcd34d!important}

/* Favorites — farthest, most prominent gold */
.pd-fav-btn{
  width:42px!important;height:42px!important;
  border-radius:12px!important;
  border:1.5px solid rgba(245,158,11,.35)!important;
  background:linear-gradient(145deg,#fffbeb,#fef3c7)!important;
  color:#d97706!important;
  box-shadow:0 2px 10px rgba(245,158,11,.18);
  font-size:16px!important;
}
.pd-fav-btn:hover{
  border-color:rgba(245,158,11,.55)!important;
  color:#b45309!important;
  box-shadow:0 4px 14px rgba(245,158,11,.28);
  transform:translateY(-1px);
}
.dark .pd-fav-btn{
  background:linear-gradient(145deg,rgba(120,53,15,.45),rgba(15,23,42,.75))!important;
  border-color:rgba(251,191,36,.4)!important;
  color:#fbbf24!important;
  box-shadow:0 2px 12px rgba(245,158,11,.2);
}
.dark .pd-fav-btn:hover{color:#fcd34d!important}

@media(max-width:600px){
  .pd-logo-wrap,.pd-logo-img{width:36px;height:36px;flex-basis:36px;border-radius:10px}
  .pd-home-btn{width:36px;height:36px;flex-basis:36px;border-radius:10px;font-size:14px}
  .pd-theme-btn,.pd-fav-btn{width:40px!important;height:40px!important;font-size:15px!important}
  .pd-lang-toggle.pd-lang-toggle-lg button{min-width:40px;min-height:32px;padding:5px 9px!important;font-size:11px!important}
  .pd-header-actions{gap:6px!important}
  .pd-brand{font-size:1rem!important}
}


/* ========== BILINGUAL UX ========== */
html[lang=ar] body,
html[dir=rtl] body{
  font-family:Cairo,system-ui,sans-serif!important;
  letter-spacing:0;
}
html[lang=en] body,
html[dir=ltr] body{

}

  letter-spacing:0;
  font-family:Cairo,system-ui,sans-serif;
}
html[dir=rtl] .pd-search,
html[dir=rtl] .pd-field input,
html[dir=rtl] .pd-field select,
html[dir=rtl] .pd-radio-legend-text,
html[dir=rtl] .pd-tool-name,
html[dir=rtl] .pd-cat-name,

/* ========== RESPONSIVE TOOL FIELD CARDS ========== */
#tool-fields{
  display:grid!important;
  gap:8px!important;
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
}
@media(min-width:480px){
  #tool-fields{gap:10px!important}
}
@media(min-width:700px){
  #tool-fields{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:12px!important}
}
@media(min-width:1000px){
  #tool-fields{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:14px!important}
}
@media(min-width:1280px){
  #tool-fields{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:16px!important}
}

/* Scale card internals with viewport */
#tool-fields > .pd-radio-group.pd-radio-yn{
  padding:clamp(8px,1.2vw,14px) clamp(8px,1.1vw,14px)!important;
  border-radius:clamp(10px,1.2vw,16px)!important;
  gap:clamp(6px,1vw,10px)!important;
}
#tool-fields > .pd-radio-group.pd-radio-yn .pd-radio-legend-text{
  font-size:clamp(11px,1.15vw,14px)!important;
  min-height:auto!important;

}
#tool-fields > .pd-radio-group.pd-radio-yn .pd-radio-card{
  min-height:clamp(32px,3.2vw,44px)!important;
  padding:clamp(6px,0.9vw,10px) clamp(6px,0.8vw,12px)!important;
  font-size:clamp(10.5px,1.05vw,13px)!important;
  border-radius:clamp(8px,1vw,12px)!important;
}
#tool-fields > .pd-field{
  min-height:clamp(68px,8vw,96px)!important;
  padding:clamp(8px,1.1vw,14px)!important;
  border-radius:clamp(10px,1.2vw,16px)!important;
}

  font-size:clamp(10px,1.05vw,13px)!important;
  margin-bottom:clamp(5px,0.8vw,10px)!important;
}
#tool-fields > .pd-field input,
#tool-fields > .pd-field select{
  height:clamp(36px,4vw,48px)!important;
  font-size:clamp(13px,1.2vw,16px)!important;
  border-radius:clamp(8px,1vw,12px)!important;
}
#tool-fields > .pd-check{
  min-height:clamp(48px,6vw,72px)!important;
  padding:clamp(8px,1vw,12px)!important;
  font-size:clamp(11px,1.1vw,14px)!important;
  border-radius:clamp(10px,1.2vw,14px)!important;
}
#tool-fields > .pd-radio-group:not(.pd-radio-yn){
  padding:clamp(8px,1.1vw,14px)!important;
  border-radius:clamp(10px,1.2vw,16px)!important;
}
#tool-fields > .pd-radio-group:not(.pd-radio-yn) .pd-radio-legend-text,
#tool-fields > .pd-radio-group:not(.pd-radio-yn) legend{

}
#tool-fields > .pd-radio-group:not(.pd-radio-yn) .pd-radio-card{
  min-height:clamp(34px,3.5vw,46px)!important;
  font-size:clamp(10.5px,1.05vw,13px)!important;
  padding:clamp(6px,0.9vw,10px)!important;
}

/* On very large screens prefer readability over too many columns */
@media(min-width:1500px){
  #tool-fields{grid-template-columns:repeat(4,minmax(0,1fr))!important;max-width:1400px}
}


/* ========== LIST HEADER EMPHASIS ========== */
.pd-list-header{
  display:flex!important;
  align-items:center!important;
  justify-content:flex-start!important;
  gap:14px!important;
  padding:16px 16px!important;
  margin-bottom:16px!important;
  border-radius:18px!important;
  border:1px solid var(--pd-border)!important;
  background:linear-gradient(135deg, color-mix(in srgb, var(--pd-card) 92%, #ecfdf5), var(--pd-card))!important;
  box-shadow:0 4px 18px rgba(15,23,42,.07)!important;
  position:relative;
  isolation:isolate;
}
.pd-list-header::after{
  content:"";
  position:absolute;
  left:16px;right:16px;bottom:0;
  height:1px;
  background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--pd-green) 35%, transparent), transparent);
  opacity:.7;
}
.dark .pd-list-header{
  background:linear-gradient(135deg, color-mix(in srgb, var(--pd-card) 88%, rgba(5,150,105,.2)), var(--pd-card))!important;
  box-shadow:0 6px 20px rgba(0,0,0,.3)!important;
}
.pd-list-head-text{
  display:flex!important;
  flex-direction:column!important;
  align-items:flex-start!important;
  justify-content:center!important;
  text-align:start!important;
  min-width:0;
  flex:1;
  gap:4px;
}
.pd-list-title{
  font-size:clamp(15px, 2.2vw, 18px)!important;
  font-weight:900!important;
  letter-spacing:.01em;
  line-height:1.2!important;
  margin:0!important;
  color:var(--pd-text)!important;
}
.pd-list-count{
  display:inline-flex!important;
  align-items:center!important;
  gap:8px!important;
  margin:0!important;
  padding:3px 10px!important;
  border-radius:999px!important;
  background:color-mix(in srgb, var(--pd-green) 12%, var(--pd-bg))!important;
  color:var(--pd-green)!important;
  font-size:11.5px!important;
  font-weight:800!important;
  width:fit-content!important;
  max-width:100%;
}
.pd-list-count::before{
  content:""!important;
  width:7px!important;height:7px!important;border-radius:50%!important;
  background:currentColor!important;
  opacity:.9!important;
}
.dark .pd-list-count{
  background:rgba(52,211,153,.14)!important;
  color:#6ee7b7!important;
}
.pd-list-back{
  width:44px!important;
  height:44px!important;
  flex:0 0 44px!important;
  border-radius:14px!important;
  border:1px solid var(--pd-border)!important;
  background:var(--pd-bg)!important;
  box-shadow:0 1px 4px rgba(15,23,42,.05);

.pd-list-cat-icon{

}
.pd-list-tools .pd-tool-row{

  line-clamp: 2 !important;
  max-height: none !important;
  min-height: 0 !important;
  hyphens: auto;
  word-break: break-word;
  overflow-wrap: anywhere;
}
/* Prefer wrapping over cutting mid-word when possible */
#tool-fields > .pd-radio-group.pd-radio-yn .pd-radio-legend-text{
  font-size: clamp(11px, 1.15vw, 13.5px) !important;
  line-height: 1.35 !important;
}
#tool-fields > .pd-check span{
  white-space: normal !important;
  overflow: visible !important;
  text-overflow: unset !important;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: clip;
  line-height: 1.3;
}
#tool-fields > .pd-field label{
  white-space: normal !important;
  overflow: hidden !important;
  text-overflow: clip !important;
  display: -webkit-box !important;
  -webkit-line-clamp: 2 !important;
  -webkit-box-orient: vertical !important;
  line-height: 1.3 !important;
}


/* ========== SCORE BAR NO OVERLAP + TOOL INFO + LIST RADIOS ========== */
.pd-tool-bottom-bar{
  position:absolute!important;
  left:0;right:0;bottom:0;
  z-index:6!important;
  pointer-events:none;
}
.pd-tool-bottom-bar .pd-score-box,
.pd-tool-bottom-bar .pd-score-reset{
  pointer-events:auto;
}
.pd-sheet-body{
  padding-bottom:calc(var(--pd-fixed-h) + 36px + env(safe-area-inset-bottom,0px))!important;
}
@media(max-width:600px){
  :root{--pd-fixed-h:82px}
  .pd-sheet-body{
    padding-bottom:calc(var(--pd-fixed-h) + 40px + env(safe-area-inset-bottom,0px))!important;
  }
}
@media(min-width:900px){
  :root{--pd-fixed-h:86px}
  .pd-sheet-body{
    padding-bottom:calc(var(--pd-fixed-h) + 32px)!important;
  }
}
/* Keep result card above bottom bar */
#tool-result .pd-result{
  margin-bottom:8px;
}

.pd-tool-info{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:12px 14px;
  margin-bottom:12px;
  border-radius:14px;
  border:1px solid color-mix(in srgb, var(--pd-green) 25%, var(--pd-border));
  background:color-mix(in srgb, var(--pd-green) 8%, var(--pd-bg));
  color:var(--pd-text);
  font-size:12.5px;
  font-weight:600;
  line-height:1.45;
}
.pd-tool-info i{
  color:var(--pd-green);
  margin-top:2px;
  flex:0 0 auto;
}
.dark .pd-tool-info{
  background:rgba(5,150,105,.12);
  border-color:rgba(52,211,153,.25);
}

/* List-style radio (Sgarbossa, Killip, NYHA) */
#tool-fields > .pd-radio-group.pd-radio-list{
  grid-column:1 / -1!important;
}
#tool-fields > .pd-radio-group.pd-radio-list .pd-radio-grid{
  grid-template-columns:1fr!important;
  gap:8px!important;
}
#tool-fields > .pd-radio-group.pd-radio-list .pd-radio-card{
  justify-content:flex-start!important;
  text-align:start!important;
  min-height:44px!important;
  padding:10px 12px!important;
  font-size:12px!important;
  font-weight:700!important;
  line-height:1.35!important;
}

{keys:['ibuprofen','cataflam'],sev:'Major',mech:'Duplicate NSAID — additive GI/renal toxicity',mgmt:'Avoid concurrent systemic NSAIDs.'},

];
for(const p of pairs){if(p.keys.every(k=>a.includes(k)||b.includes(k)))return{value:p.sev,unit:'',badge:p.sev,badgeClass:p.sev==='Major'?'danger':'warn',extra:{mechanism:p.mech,management:p.mgmt,source:'Frontend sample / Backend Required'}}}

}}
];

function convertScoreChecks(id){
  const x=toolById(id); if(!x)return;

function calcHeart(v){
 if(v.history==null||v.ecg==null||v.age==null||v.trop==null||v.uln==null||v.uln<=0)return null;
 const h=+v.history,e=+v.ecg,a=v.age<45?0:v.age<65?1:2;
 const rf=['htn','hyper','dm','obesity','smoking','family','vascular'].filter(k=>v[k]).length;
 const r=rf===0?0:rf<=2?1:2, tr=v.trop/v.uln<=1?0:v.trop/v.uln<=3?1:2, total=h+e+a+r+tr;
 return {value:total+' / 10',unit:'',badge:total>=7?'High risk':total>=4?'Moderate risk':'Low risk',badgeClass:total>=7?'danger':total>=4?'warn':'',breakdown:[['History',h],['ECG',e],['Age',a],['Risk factors',r],['Troponin',tr]].map(x=>({label:x[0],value:x[1]})),formula:'HEART = History + ECG + Age + Risk factors + Troponin. Troponin: ≤1× ULN=0; >1–3×=1; >3×=2.'};
}
function calcNews2(v){
 if([v.rr,v.spo2,v.sbp,v.hr,v.temp].some(x=>x==null||!Number.isFinite(+x)))return null;
 const rr=+v.rr,sp=+v.spo2,sb=+v.sbp,hr=+v.hr,tp=+v.temp;
 const a=rr<=8||rr>=25?3:rr<=11?1:rr<=20?0:2;
 const b=sp<=91?3:sp<=93?2:sp<=95?1:0;
 const c=sb<=90?3:sb<=100?2:sb<=110?1:sb<=219?0:3;
 const d=hr<=40?3:hr<=50?1:hr<=90?0:hr<=110?1:hr<=130?2:3;
 const e=tp<=35?3:tp<=36?1:tp<=38?0:tp<=39?1:2;
 const o=v.o2?2:0,total=a+b+c+d+e+o;
 return {value:total+'/20',unit:'',badge:total>=7?'High':total>=5?'Medium':total>=1?'Low':'Low',badgeClass:total>=7?'danger':total>=5?'warn':'',breakdown:[['Respiratory rate',a],['SpO₂',b],['Supplemental O₂',o],['SBP',c],['Heart rate',d],['Temperature',e]].map(x=>({label:x[0],value:x[1]})),formula:'NEWS2 standard scoring, SpO₂ Scale 1.'};
}
function calcHcmRisk(v){
 const req=['age','wall','la','lvot'];if(req.some(k=>v[k]==null||!Number.isFinite(+v[k])))return null;
 const age=+v.age,m=+v.wall,la=+v.la,lv=+v.lvot;
 const pi=.15939858*m-.00294271*m*m+.0259082*la+.00446131*lv+.4583082*(v.family==='yes'?1:0)+.82639195*(v.nsvt==='yes'?1:0)+.71650361*(v.syncope==='yes'?1:0)-.01799934*age;
 const risk=(1-Math.pow(.998,Math.exp(pi)))*100;
 return {value:risk.toFixed(1)+'%',unit:'5-year SCD risk',badge:risk>=6?'High risk':risk>=4?'Intermediate risk':'Low risk',badgeClass:risk>=6?'danger':risk>=4?'warn':'',breakdown:[['Prognostic index',pi.toFixed(3)]],formula:'2014 ESC HCM Risk-SCD model: P=1−0.998^exp(PI), using wall thickness, LA diameter, LVOT gradient, family history, NSVT, syncope and age.'};
}
function calcGrace(v){
 const vals=['age','hr','sbp','creat'];if(vals.some(k=>v[k]==null||!Number.isFinite(+v[k])))return null;
 let s=0,a=+v.age,h=+v.hr,b=+v.sbp,c=+v.creat;
 s+=a<30?0:a<40?8:a<50?25:a<60?41:a<70?58:a<80?75:91;
 s+=h<50?0:h<70?3:h<90?9:h<110?15:h<150?24:h<200?38:46;
 s+=b<80?58:b<100?53:b<120?43:b<140?34:b<160?24:b<200?10:0;

 s+=+v.killip===1?0:+v.killip===2?20:+v.killip===3?39:59;
 if(v.arrest)s+=39;if(v.st)s+=28;if(v.marker)s+=14;

}

 s+=pts(ph,[[7.7,99,4],[7.6,7.699,3],[7.5,7.599,1],[7.33,7.499,0],[7.25,7.329,2],[7.15,7.249,3],[-99,7.149,4]]);
 s+=pts(na,[[180,999,4],[160,179,3],[155,159,2],[150,154,1],[130,149,0],[120,129,2],[111,119,3],[-99,110,4]]);
 s+=pts(k,[[7,999,4],[6,6.999,3],[5.5,5.999,1],[3.5,5.499,0],[3,3.499,1],[2.5,2.999,2],[-99,2.499,4]]);
 let cp=pts(cr,[[3.5,999,4],[2,3.499,3],[1.5,1.999,2],[.6,1.499,0],[-99,.599,2]]);if(v.arfr==='yes')cp*=2;s+=cp;

 s+=pts(w,[[40,999,4],[20,39.999,2],[15,19.999,1],[3,14.999,0],[1,2.999,2],[-99,.999,4]]);

function calcNIHSS(v){
 const keys=['loc','locq','locc','gaze','visual','facial','armL','armR','legL','legR','ataxia','sensory','language','dysarthria','extinction'];
 const labels={loc:'1a LOC',locq:'1b LOC questions',locc:'1c LOC commands',gaze:'2 Gaze',visual:'3 Visual',facial:'4 Facial',armL:'5a Arm L',armR:'5b Arm R',legL:'6a Leg L',legR:'6b Leg R',ataxia:'7 Ataxia',sensory:'8 Sensory',language:'9 Language',dysarthria:'10 Dysarthria',extinction:'11 Extinction'};
 const filled=keys.filter(k=>v[k]!==null&&v[k]!==undefined&&v[k]!=='');
 if(!filled.length)return {value:'—',unit:'/42',badge:'Select items',badgeClass:''};
 const total=keys.reduce((a,k)=>a+(v[k]===null||v[k]===undefined||v[k]===''?0:Number(v[k])),0);
 return {value:total,unit:'/42',badge:total>=21?'Severe':total>=6?'Moderate':total>=1?'Minor':'No measurable deficit',badgeClass:total>=21?'danger':total>=6?'warn':'',breakdown:filled.map(k=>({label:labels[k]||k,value:v[k]})),formula:'NIHSS = sum of 15 neurologic domains (empty items count as 0 until scored). Follow bedside definitions exactly.'};
}
function calcASCVD(v){
 const age=Number(v.age),tc=Number(v.tc),hdl=Number(v.hdl),sbp=Number(v.sbp);
 if(![age,tc,hdl,sbp].every(Number.isFinite)||age<40||age>79||tc<=0||hdl<=0||sbp<=0)return null;
 const la=Math.log(age),lt=Math.log(tc),lh=Math.log(hdl),ls=Math.log(sbp),sm=v.smoker?1:0,dm=v.dm?1:0,tr=v.treated?1:0;
 let sum,mean,base;
 if(v.sex==='m'){
  sum=12.344*la+11.853*lt-2.664*la*lt-7.990*lh+1.769*la*lh+(tr?1.797:1.764)*ls+7.837*sm-1.795*la*sm+0.658*dm;
  mean=61.18;base=.9144;
 }else{
  sum=-29.799*la+4.884*la*la+13.540*lt-3.114*la*lt-13.578*lh+3.149*la*lh+(tr?2.019:1.957)*ls+7.574*sm-1.665*la*sm+0.661*dm;
  mean=-29.18;base=.9665;
 }
 const risk=(1-Math.pow(base,Math.exp(sum-mean)))*100;
 return {value:Math.max(0,Math.min(100,risk)).toFixed(1)+'%',unit:'estimated 10-year ASCVD risk',badge:'2013 Pooled Cohort Equation',badgeClass:risk>=20?'danger':risk>=7.5?'warn':'',formula:'2013 ACC/AHA Pooled Cohort Equation for White/other adults 40–79 years; sex-specific coefficients and treated/untreated SBP terms are used.'};
}

replaceFields('abg',[
 {id:'ph',type:'number',en:'pH',ar:'pH',min:6.5,max:8,step:0.01,required:true},
 {id:'paco2',type:'number',en:'PaCO₂ (mmHg)',ar:'PaCO₂ (مم زئبق)',min:5,max:120,required:true},
 {id:'hco3',type:'number',en:'HCO₃ (mEq/L)',ar:'HCO₃ (مEq/لتر)',min:1,max:60,required:true}
]);
toolById('abg').sample={ph:7.28,paco2:50,hco3:24};
toolById('abg').calc=function(v){
  if(v.ph==null||v.paco2==null||v.hco3==null)return null;
  const ph=+v.ph, co2=+v.paco2, hco=+v.hco3;
  if(!Number.isFinite(ph)||!Number.isFinite(co2)||!Number.isFinite(hco)||co2<=0||hco<=0)return null;

  // Henderson–Hasselbalch validity: calculated pH = 6.1 + log10(HCO3 / (0.0301 × PaCO2))
  const denom=0.0301*co2;
  const calcPh=6.1+Math.log10(hco/denom);
  const delta=Math.abs(ph-calcPh);
  // Common bedside tolerance ~0.03–0.05; use 0.04
  const valid=delta<=0.04;
  const validityLabel=lang==='ar'
    ?(valid?'صالح (Henderson–Hasselbalch)':'غير صالح — راجع العينة/الجهاز')
    :(valid?'Valid (Henderson–Hasselbalch)':'Invalid ABG — check sample/analyzer');

  if(!valid){
    return{
      value:lang==='ar'?'غازات دم غير صالحة (Invalid ABG)':'Invalid ABG',
      unit:lang==='ar'
        ?('pH المقاس '+ph.toFixed(2)+' ≠ المحسوب '+calcPh.toFixed(2)+' (|Δ|='+delta.toFixed(3)+')')
        :('Measured pH '+ph.toFixed(2)+' ≠ calculated '+calcPh.toFixed(2)+' (|Δ|='+delta.toFixed(3)+')'),
      badge:validityLabel,
      badgeClass:'danger',
      breakdown:[
        {label:lang==='ar'?'pH المقاس':'Measured pH',value:ph.toFixed(2)},
        {label:lang==='ar'?'pH المحسوب':'Calculated pH',value:calcPh.toFixed(2)},
        {label:'|ΔpH|',value:delta.toFixed(3)},
        {label:'PaCO₂',value:co2.toFixed(0)+' mmHg'},
        {label:'HCO₃',value:hco.toFixed(1)+' mEq/L'}
      ],
      formula:lang==='ar'
        ?'الصلاحية: pH = 6.1 + log₁₀(HCO₃ / (0.0301 × PaCO₂)). إذا |pH المقاس − المحسوب| > 0.04 فالعينة غالبًا غير صالحة.'
        :'Validity: pH = 6.1 + log₁₀(HCO₃ / (0.0301 × PaCO₂)). If |measured − calculated pH| > 0.04, the ABG is likely invalid.'
    };
  }

  const nPh=ph>=7.35&&ph<=7.45, nCo2=co2>=35&&co2<=45, nHco=hco>=22&&hco<=26;
  const acidemia=ph<7.35, alkalemia=ph>7.45;
  const hiCo2=co2>45, loCo2=co2<35, hiHco=hco>26, loHco=hco<22;

  const near=function(a,b,tol){return Math.abs(a-b)<=tol;};
  const winters=1.5*hco+8;
  const expCo2MetAlk=40+0.6*(hco-24);
  const dCo2=co2-40;
  const hcoAcuteAcid=24+0.1*dCo2;
  const hcoChronAcid=24+0.4*dCo2;
  const hcoAcuteAlk=24-0.2*(40-co2);
  const hcoChronAlk=24-0.5*(40-co2);

  let primary='Normal acid–base';
  let detail='';
  let badgeClass='';

  if(nPh&&nCo2&&nHco){
    primary=lang==='ar'?'طبيعي':'Normal acid–base';
  }else if(acidemia){
    if(hiCo2&&!loHco){
      if(near(hco,hcoAcuteAcid,2)){
        primary=lang==='ar'?'حماض تنفسي حاد':'Acute respiratory acidosis';
        detail=lang==='ar'?'HCO₃ يقترب من المتوقع للحالة الحادة':'HCO₃ near acute expected';
      }else if(near(hco,hcoChronAcid,3)||hco>hcoAcuteAcid+2){
        primary=lang==='ar'?'حماض تنفسي مزمن (معاوض جزئياً/كلياً)':'Chronic respiratory acidosis (partial/full compensation)';
        detail=lang==='ar'?'HCO₃ يقترب من المتوقع للمزمن':'HCO₃ near chronic expected';
      }else if(loHco){
        primary=lang==='ar'?'حماض مختلط (تنفسي + استقلابي)':'Mixed acidosis (respiratory + metabolic)';
      }else{
        primary=lang==='ar'?'حماض تنفسي':'Respiratory acidosis';
      }
      badgeClass=ph<7.2?'danger':'warn';
    }else if(loHco&&!hiCo2){
      if(near(co2,winters,2)){
        primary=lang==='ar'?'حماض استقلابي معاوض تنفسياً':'Metabolic acidosis with appropriate respiratory compensation';
        detail=lang==='ar'?'PaCO₂ ≈ معادلة Winter':'PaCO₂ matches Winter’s formula';
      }else if(co2>winters+2){
        primary=lang==='ar'?'حماض استقلابي + حماض تنفسي مرافق':'Metabolic acidosis + concurrent respiratory acidosis';
      }else if(co2<winters-2){
        primary=lang==='ar'?'حماض استقلابي + قلاء تنفسي مرافق':'Metabolic acidosis + concurrent respiratory alkalosis';
      }else{
        primary=lang==='ar'?'حماض استقلابي':'Metabolic acidosis';
      }
      badgeClass=ph<7.2?'danger':'warn';
    }else if(hiCo2&&loHco){
      primary=lang==='ar'?'حماض مختلط (تنفسي + استقلابي)':'Mixed acidosis (respiratory + metabolic)';
      badgeClass='danger';
    }else{
      primary=lang==='ar'?'حموضة دم — نمط غير نمطي':'Acidemia — atypical pattern';
      badgeClass='warn';
    }
  }else if(alkalemia){
    if(loCo2&&!hiHco){
      if(near(hco,hcoAcuteAlk,2)){
        primary=lang==='ar'?'قلاء تنفسي حاد':'Acute respiratory alkalosis';
      }else if(near(hco,hcoChronAlk,3)||hco<hcoAcuteAlk-2){
        primary=lang==='ar'?'قلاء تنفسي مزمن (معاوض)':'Chronic respiratory alkalosis (compensated)';
      }else if(hiHco){
        primary=lang==='ar'?'قلاء مختلط (تنفسي + استقلابي)':'Mixed alkalosis (respiratory + metabolic)';
      }else{
        primary=lang==='ar'?'قلاء تنفسي':'Respiratory alkalosis';
      }
      badgeClass=ph>7.6?'danger':'warn';
    }else if(hiHco&&!loCo2){
      if(near(co2,expCo2MetAlk,5)){
        primary=lang==='ar'?'قلاء استقلابي معاوض تنفسياً':'Metabolic alkalosis with respiratory compensation';
      }else if(co2<expCo2MetAlk-5){
        primary=lang==='ar'?'قلاء استقلابي + قلاء تنفسي مرافق':'Metabolic alkalosis + concurrent respiratory alkalosis';
      }else if(co2>expCo2MetAlk+5){
        primary=lang==='ar'?'قلاء استقلابي + حماض تنفسي مرافق':'Metabolic alkalosis + concurrent respiratory acidosis';
      }else{
        primary=lang==='ar'?'قلاء استقلابي':'Metabolic alkalosis';
      }
      badgeClass=ph>7.6?'danger':'warn';
    }else if(loCo2&&hiHco){
      primary=lang==='ar'?'قلاء مختلط (تنفسي + استقلابي)':'Mixed alkalosis (respiratory + metabolic)';
      badgeClass='danger';
    }else{
      primary=lang==='ar'?'قلاء دم — نمط غير نمطي':'Alkalemia — atypical pattern';
      badgeClass='warn';
    }
  }else{
    if(hiCo2&&hiHco){
      if(near(hco,hcoChronAcid,3)){
        primary=lang==='ar'?'حماض تنفسي مزمن معاوض بالكامل':'Fully compensated chronic respiratory acidosis';
        detail=lang==='ar'?'pH طبيعي مع ارتفاع PaCO₂ وHCO₃':'Normal pH with ↑PaCO₂ and ↑HCO₃';
      }else if(near(co2,expCo2MetAlk,5)){
        primary=lang==='ar'?'قلاء استقلابي معاوض بالكامل':'Fully compensated metabolic alkalosis';
        detail=lang==='ar'?'pH طبيعي مع ارتفاع HCO₃ وPaCO₂':'Normal pH with ↑HCO₃ and ↑PaCO₂';
      }else{
        primary=lang==='ar'?'اضطراب معاوض (↑PaCO₂ و↑HCO₃) — حماض تنفسي مزمن أو قلاء استقلابي':'Compensated disorder (↑PaCO₂ & ↑HCO₃) — chronic respiratory acidosis or metabolic alkalosis';
        detail=lang==='ar'?'ميّز بالسياق السريري':'Distinguish by clinical context';
      }
      badgeClass='warn';
    }else if(loCo2&&loHco){
      if(near(hco,hcoChronAlk,3)){
        primary=lang==='ar'?'قلاء تنفسي مزمن معاوض بالكامل':'Fully compensated chronic respiratory alkalosis';
        detail=lang==='ar'?'pH طبيعي مع انخفاض PaCO₂ وHCO₃':'Normal pH with ↓PaCO₂ and ↓HCO₃';
      }else if(near(co2,winters,3)){
        primary=lang==='ar'?'حماض استقلابي معاوض بالكامل':'Fully compensated metabolic acidosis';
        detail=lang==='ar'?'pH طبيعي مع انخفاض HCO₃ وPaCO₂':'Normal pH with ↓HCO₃ and ↓PaCO₂';
      }else{
        primary=lang==='ar'?'اضطراب معاوض (↓PaCO₂ و↓HCO₃) — قلاء تنفسي مزمن أو حماض استقلابي':'Compensated disorder (↓PaCO₂ & ↓HCO₃) — chronic respiratory alkalosis or metabolic acidosis';
        detail=lang==='ar'?'ميّز بالسياق السريري':'Distinguish by clinical context';
      }
      badgeClass='warn';
    }else if(hiCo2&&nHco){
      primary=lang==='ar'?'ارتفاع PaCO₂ مع HCO₃ طبيعي — بداية حماض تنفسي أو معاوضة ناقصة':'↑PaCO₂ with normal HCO₃ — early respiratory acidosis or incomplete compensation';
      badgeClass='warn';
    }else if(loCo2&&nHco){
      primary=lang==='ar'?'انخفاض PaCO₂ مع HCO₃ طبيعي — بداية قلاء تنفسي أو معاوضة ناقصة':'↓PaCO₂ with normal HCO₃ — early respiratory alkalosis or incomplete compensation';
      badgeClass='warn';
    }else if(hiHco&&nCo2){
      primary=lang==='ar'?'ارتفاع HCO₃ مع PaCO₂ طبيعي — بداية قلاء استقلابي أو معاوضة ناقصة':'↑HCO₃ with normal PaCO₂ — early metabolic alkalosis or incomplete compensation';
      badgeClass='warn';
    }else if(loHco&&nCo2){
      primary=lang==='ar'?'انخفاض HCO₃ مع PaCO₂ طبيعي — بداية حماض استقلابي أو معاوضة ناقصة':'↓HCO₃ with normal PaCO₂ — early metabolic acidosis or incomplete compensation';
      badgeClass='warn';
    }else if((hiCo2&&loHco)||(loCo2&&hiHco)){
      primary=lang==='ar'?'نمط مختلط مع pH طبيعي':'Mixed pattern with normal pH';
      badgeClass='warn';
    }else{
      primary=lang==='ar'?'قيم خارج النطاق — راجع المدخلات':'Out-of-range values — review inputs';
      badgeClass='warn';
    }
  }

  const breakdown=[
    {label:lang==='ar'?'الصلاحية':'Validity',value:validityLabel},
    {label:lang==='ar'?'pH المقاس':'Measured pH',value:ph.toFixed(2)},
    {label:lang==='ar'?'pH المحسوب (HH)':'Calculated pH (HH)',value:calcPh.toFixed(2)},
    {label:'|ΔpH|',value:delta.toFixed(3)},
    {label:'PaCO₂',value:co2.toFixed(0)+' mmHg'},
    {label:'HCO₃',value:hco.toFixed(1)+' mEq/L'}
  ];
  if(loHco) breakdown.push({label:lang==='ar'?'PaCO₂ المتوقع (Winter)':'Expected PaCO₂ (Winter)',value:winters.toFixed(0)+' mmHg'});
  if(hiCo2){breakdown.push({label:lang==='ar'?'HCO₃ حاد متوقع':'Expected HCO₃ (acute resp. acid.)',value:hcoAcuteAcid.toFixed(1)});breakdown.push({label:lang==='ar'?'HCO₃ مزمن متوقع':'Expected HCO₃ (chronic resp. acid.)',value:hcoChronAcid.toFixed(1)});}
  if(loCo2){breakdown.push({label:lang==='ar'?'HCO₃ حاد متوقع':'Expected HCO₃ (acute resp. alk.)',value:hcoAcuteAlk.toFixed(1)});breakdown.push({label:lang==='ar'?'HCO₃ مزمن متوقع':'Expected HCO₃ (chronic resp. alk.)',value:hcoChronAlk.toFixed(1)});}

  return{
    value:primary,
    unit:detail||'',
    badge:validityLabel,
    badgeClass:badgeClass,
    breakdown:breakdown,
    formula:lang==='ar'
      ?'الصلاحية: pH = 6.1 + log₁₀(HCO₃/(0.0301×PaCO₂)). المعاوضة: Winter؛ تنفسي حاد/مزمن ΔHCO₃≈0.1/0.4×ΔCO₂ (حماض) و0.2/0.5 (قلاء).'
      :'Validity: pH = 6.1 + log₁₀(HCO₃/(0.0301×PaCO₂)). Compensation: Winter’s; respiratory acute/chronic ΔHCO₃≈0.1/0.4×ΔCO₂ (acidosis) and 0.2/0.5 (alkalosis).'
  };
};
toolById('abg').infoEn='Checks ABG validity with Henderson–Hasselbalch, then interprets acid–base status including compensated disorders and acute vs chronic respiratory patterns.';
toolById('abg').infoAr='يتحقق من صلاحية غازات الدم بمعادلة Henderson–Hasselbalch ثم يفسّر الحالة الحمضية-القاعدية بما في ذلك المعاوضة والتمييز الحاد/المزمن للتنفسي.';

function normalizeSearch(s){return String(s||'').toLocaleLowerCase().normalize('NFKC').replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ًٌٍَُِّْـ]/g,'').replace(/[^\p{L}\p{N}+#.-]+/gu,' ').trim()}
function matchesQuery(x,q){if(!q)return true;const aliases={cha2ds2vasc:'chads vasc af stroke',wells_pe:'pulmonary embolism pe',wells_dvt:'deep vein thrombosis dvt',gcs:'glasgow coma glasgow coma scale',heart:'chest pain acute coronary syndrome',egfr_ckd:'kidney renal gfr',bsa:'body surface area',anc:'absolute neutrophil count neutrophil',qtc:'qt correction corrected qt',abg:'blood gas arterial blood gas',peds_gfr:'pediatric kidney renal',nihss:'stroke neurologic deficit',map:'mean arterial pressure',bun_cr:'bun creatinine ratio',pf_ratio:'pao2 fio2',sofa:'organ failure sepsis',qsofa:'sepsis quick sofa'};const hay=normalizeSearch([x.en,x.ar,x.descEn,x.descAr,aliases[x.id]||'',catName(catById(x.cat))].join(' '));const query=normalizeSearch(q);if(!query)return true;return query.split(/\s+/).filter(Boolean).every(t=>hay.includes(t))}

function searchScore(x,q){const query=normalizeSearch(q),compact=query.replace(/\s+/g,'');if(!query)return 0;const aliases={cha2ds2vasc:'chads vasc af stroke',wells_pe:'pulmonary embolism pe',wells_dvt:'deep vein thrombosis dvt',gcs:'glasgow coma glasgow coma scale',heart:'chest pain acute coronary syndrome',egfr_ckd:'kidney renal gfr',bsa:'body surface area',anc:'absolute neutrophil count neutrophil',qtc:'qt correction corrected qt',abg:'blood gas arterial blood gas',peds_gfr:'pediatric kidney renal',nihss:'stroke neurologic deficit',map:'mean arterial pressure',bun_cr:'bun creatinine ratio',pf_ratio:'pao2 fio2',sofa:'organ failure sepsis',qsofa:'sepsis quick sofa'};const fields=[x.en,x.ar,x.descEn,x.descAr,aliases[x.id]||'',catName(catById(x.cat))].map(normalizeSearch);let score=0;for(const token of query.split(/\s+/).filter(Boolean)){let best=0;for(const field of fields){if(field===token)best=Math.max(best,100);else if(field.startsWith(token))best=Math.max(best,85);else if(field.includes(token))best=Math.max(best,70);else if(token.length>=3){for(const word of field.split(/\s+/)){if(word&&levenshtein(token,word)<=Math.max(1,Math.floor(token.length/4)))best=Math.max(best,45)}}}if(!best)return 0;score+=best}if(compact.length>=2&&fields.join(' ').replace(/\s+/g,'').includes(compact))score+=25;return score}

  scope.querySelectorAll('.pd-pressable, .pd-press, .pd-cat-card, .pd-tool-row, .pd-recent-item, .pd-suggestion, .pd-icon-btn, .pd-close-btn, .pd-star, .pd-back, .pd-btn').forEach(el=>{
    if(el.dataset.pressBound)return;
    el.dataset.pressBound='1';
    const down=()=>{
      el.classList.add('pd-pressing');
      if(typeof anime==='function' && !prefersReducedMotion()){
        anime.remove(el);
        anime({targets:el, scale:0.96, duration:90, easing:'easeOutQuad'});
        const icon=el.querySelector('.pd-tool-icon, .pd-cat-icon, .pd-recent-icon, .pd-suggestion-icon, i');
        if(icon){anime.remove(icon);anime({targets:icon, scale:1.08, duration:120, easing:'easeOutBack'})}
      }
    };
    const up=()=>{
      el.classList.remove('pd-pressing');
      if(typeof anime==='function' && !prefersReducedMotion()){
        anime.remove(el);
        anime({targets:el, scale:1, duration:180, easing:'easeOutElastic(1, .6)'});
        const icon=el.querySelector('.pd-tool-icon, .pd-cat-icon, .pd-recent-icon, .pd-suggestion-icon, i');
        if(icon){anime.remove(icon);anime({targets:icon, scale:1, duration:200, easing:'easeOutCubic'})}
      }
    };
    el.addEventListener('pointerdown', down, {passive:true});
    el.addEventListener('pointerup', up, {passive:true});
    el.addEventListener('pointercancel', up, {passive:true});
    el.addEventListener('pointerleave', up, {passive:true});
  });
}

const _openTool=typeof openTool==='function'?openTool:null;
const _closeSheet=typeof closeSheet==='function'?closeSheet:null;
const _showView=typeof showView==='function'?showView:null;

function animateSheetOpen(){
  const sheet=document.querySelector('#tool-sheet .pd-sheet');
  const backdrop=document.getElementById('tool-sheet');
  if(!sheet||!backdrop)return;
  if(prefersReducedMotion()||typeof anime!=='function'){return}
  anime.remove(sheet);
  anime({targets:sheet, translateY:[28,0], opacity:[0,1], duration:320, easing:'easeOutCubic'});
  const fields=sheet.querySelectorAll('#tool-fields > *');
  if(fields.length){
    anime({targets:fields, translateY:[12,0], opacity:[0,1], delay:anime.stagger(28, {start:60}), duration:280, easing:'easeOutCubic'});
  }
}
function animateSheetClose(done){
  const sheet=document.querySelector('#tool-sheet .pd-sheet');
  if(!sheet||prefersReducedMotion()||typeof anime!=='function'){if(done)done();return}
  anime.remove(sheet);
  anime({targets:sheet, translateY:[0,18], opacity:[1,0], duration:200, easing:'easeInQuad', complete:function(){if(done)done()}});
}
function animateViewIn(id){
  const el=document.getElementById(id);
  if(!el||prefersReducedMotion()||typeof anime!=='function')return;
  anime.remove(el);
  anime({targets:el, opacity:[0,1], translateY:[10,0], duration:260, easing:'easeOutCubic'});
}

/* wrap after definitions exist - patch at end */

bindPressFeedback(document);
setTheme(theme);setLang(lang);renderAll();
})();
</script>

<script id="paldose-abg-result-fit-js">
(function () {
  function isABG(sheet) {
    if (!sheet) return false;
    /* activeToolId is set by openTool() and is language-independent;
       the old text-match fallback only worked when the UI was in English,
       which is why the result could silently skip fitting (and overflow)
       in Arabic or after any title copy changes. */
    if (typeof activeToolId !== 'undefined' && activeToolId === 'abg') return true;
    return sheet.classList.contains('abg-analyzer') ||
           sheet.getAttribute('data-tool-id') === 'abg-analyzer';
  }

  function resetFit(el) {
    /* #bottom-result-value is a single shared element reused by every
       tool, not recreated per tool. Leaving the ABG-only inline overrides
       in place after switching to another calculator would carry a
       shrunk/wrapped style over to unrelated results, so clear them. */
    if (!el) return;
    el.classList.remove('pd-abg-fit');
    el.style.fontSize = '';
    el.style.whiteSpace = '';
    el.style.overflow = '';
    el.style.textOverflow = '';
    el.style.overflowWrap = '';
    el.style.wordBreak = '';
    el.style.textAlign = '';
  }

  function fitABGResult() {
    var sheet = document.getElementById('tool-sheet');
    var el = document.getElementById('bottom-result-value');
    if (!isABG(sheet)) { resetFit(el); return; }
    if (!el) return;

    var parent = el.parentElement; /* .pd-score-main: label + value + unit + badge */
    if (!parent) return;

    el.classList.add('pd-abg-fit');

    /* Presentation only: never change the calculated result/text. */
    el.style.whiteSpace = 'nowrap';
    el.style.overflow = 'visible';
    el.style.textOverflow = 'clip';
    el.style.overflowWrap = '';
    el.style.wordBreak = '';
    el.style.textAlign = '';

    /* The room actually left for the value is the row's width minus its
       siblings (label/unit/badge) and their gaps — not the whole row,
       which is what the previous version measured. Using the full row
       width let the value keep more of its size than it should, so on
       narrow screens it overflowed past the edge of the score box. */
    var rowWidth = parent.clientWidth;
    if (!rowWidth) return;

    var gap = parseFloat(getComputedStyle(parent).columnGap) ||
              parseFloat(getComputedStyle(parent).gap) || 0;
    var siblingsWidth = 0, siblingCount = 0;
    Array.prototype.forEach.call(parent.children, function (child) {
      if (child === el) return;
      if (child.offsetWidth === 0 && !child.textContent.trim()) return;
      siblingsWidth += child.offsetWidth;
      siblingCount++;
    });

    var available = rowWidth - siblingsWidth - gap * siblingCount;
    if (available <= 0) available = rowWidth;

    var current = parseFloat(getComputedStyle(el).fontSize);
    if (!isFinite(current) || current <= 0) current = 18;

    var minSize = 8;
    var step = 0.25;

    el.style.fontSize = current + 'px';

    while (el.scrollWidth > available && current > minSize) {
      current -= step;
      el.style.fontSize = current.toFixed(2) + 'px';
    }

    /* Last resort: even at the smallest readable size the full text (with
       its unit/badge neighbors) may not fit on one line. Wrap it onto
       multiple lines within the box instead of leaving overflow:visible,
       which is what let it spill outside the score card. */
    if (el.scrollWidth > available) {
      el.style.whiteSpace = 'normal';
      el.style.overflowWrap = 'anywhere';
      el.style.wordBreak = 'break-word';
      el.style.textAlign = 'center';
    }
  }

  function scheduleFit() {
    requestAnimationFrame(function () {
      requestAnimationFrame(fitABGResult);
    });
  }

  window.addEventListener('resize', scheduleFit);
  document.addEventListener('input', scheduleFit, true);
  document.addEventListener('change', scheduleFit, true);
  window.addEventListener('load', scheduleFit);

  var observer = new MutationObserver(scheduleFit);
  observer.observe(document.documentElement, {
    childList: true,
    subtree: true,
    characterData: true
  });

  scheduleFit();
})();
</script>
