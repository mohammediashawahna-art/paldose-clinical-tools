<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<title>PALDOSE | Clinical Tools</title>
<meta name="theme-color" content="#166534"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="tailwind.min.css" rel="stylesheet"/>
<style>
:root{--pd-green:#075C3B;--pd-border:#e2e8f0;--pd-card:#fff;--pd-muted:#64748b;--pd-bg:#f8fafc;--pd-text:#0f172a;--pd-shadow:0 1px 3px rgba(15,23,42,.06),0 4px 12px rgba(15,23,42,.04);--safe-b:env(safe-area-inset-bottom,0px)}
html.dark{--pd-green:#69D49A;--pd-border:#334155;--pd-card:#1e293b;--pd-muted:#94a3b8;--pd-bg:#0f172a;--pd-text:#f8fafc;--pd-shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--pd-bg);color:var(--pd-text);min-height:100dvh;-webkit-tap-highlight-color:transparent}
html[dir=ltr] body{font-family:Poppins,Cairo,system-ui,sans-serif}
.pd-header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--pd-card) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--pd-border)}
.pd-logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#075C3B,#0d9488);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.dark .pd-logo-mark{background:linear-gradient(135deg,#069669,#14b8a6)}
.pd-brand{font-weight:800;letter-spacing:.02em;color:#075C3B;font-size:1.15rem}.dark .pd-brand{color:#69D49A}
.pd-tagline{font-size:10px;color:var(--pd-muted);font-weight:600}
.pd-icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--pd-border);background:var(--pd-card);color:var(--pd-muted);cursor:pointer}

.pd-lang-toggle button.active{background:#075C3B;color:#fff}.dark .pd-lang-toggle button.active{background:#069669}
.pd-search{width:100%;height:48px;border-radius:14px;border:1px solid var(--pd-border);background:var(--pd-card);padding:0 16px 0 44px;font-size:14px;font-weight:600;color:var(--pd-text);outline:none}

html[dir=rtl] .pd-search-icon{left:auto;right:16px}
.pd-card{background:var(--pd-card);border:1px solid var(--pd-border);border-radius:16px;box-shadow:var(--pd-shadow)}
.pd-power{background:linear-gradient(135deg,#ecfdf5,#f0fdfa);border:1px solid #a7f3d0}
.dark .pd-power{background:linear-gradient(135deg,rgba(6,78,59,.4),rgba(15,23,42,.9));border-color:rgba(52,211,153,.25)}
.pd-section-title{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
.pd-link{font-size:12px;font-weight:700;color:#059669;background:none;border:0;cursor:pointer}.dark .pd-link{color:#34d399}
.pd-fav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:380px){.pd-fav-grid{grid-template-columns:repeat(4,1fr)}}
.pd-fav-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1px solid var(--pd-border);background:var(--pd-card);text-align:center;cursor:pointer;min-height:78px;justify-content:center}
.pd-fav-item i{font-size:18px;color:#059669}.dark .pd-fav-item i{color:#34d399}
.pd-fav-item span{font-size:10px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pd-cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pd-cat-card{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid transparent;cursor:pointer;min-height:72px}
.pd-cat-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.pd-cat-name{font-size:13px;font-weight:800}.pd-cat-count{font-size:11px;font-weight:600;opacity:.75;margin-top:2px}
.pd-cat-arrow{margin-inline-start:auto;opacity:.5;font-size:12px}
.pd-tool-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--pd-card);border:1px solid var(--pd-border);border-radius:14px;cursor:pointer;min-height:72px}
.pd-tool-row:hover{border-color:#86efac}
.pd-tool-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:#ecfdf5;color:#059669}
.dark .pd-tool-icon{background:rgba(6,78,59,.4);color:#34d399}
.pd-tool-body{flex:1;min-width:0}
.pd-tool-name{font-size:14px;font-weight:800;line-height:1.25}
.pd-tool-desc{font-size:11px;font-weight:600;color:var(--pd-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-tool-cat{font-size:10px;font-weight:700;color:#059669;margin-top:3px}.dark .pd-tool-cat{color:#34d399}
.pd-star{width:36px;height:36px;border:0;background:transparent;cursor:pointer;color:#cbd5e1;font-size:16px;display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0}
.pd-star.is-fav{color:#f59e0b}
.pd-chevron{color:var(--pd-muted);font-size:12px;flex-shrink:0}
.pd-empty{text-align:center;padding:28px 16px;color:var(--pd-muted);font-size:13px;font-weight:600}
.pd-bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--pd-card);border-top:1px solid var(--pd-border);padding:6px 8px calc(6px + var(--safe-b));display:flex;justify-content:space-around;align-items:center}
.pd-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:12px;border:0;background:transparent;color:var(--pd-muted);font-size:10px;font-weight:700;cursor:pointer;min-width:56px}
.pd-nav-item.active{color:#059669}.dark .pd-nav-item.active{color:#34d399}
.pd-nav-item i{font-size:18px}
.pd-nav-item.active i{width:40px;height:32px;border-radius:999px;background:#ecfdf5;display:flex;align-items:center;justify-content:center}
.dark .pd-nav-item.active i{background:rgba(6,78,59,.45)}
.pd-main{padding-bottom:calc(78px + var(--safe-b));max-width:720px;margin:0 auto}
@media(min-width:768px){.pd-main{max-width:860px;padding-left:20px;padding-right:20px}.pd-cat-grid{grid-template-columns:repeat(3,1fr)}}
.pd-sheet-backdrop{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center}
.pd-sheet-backdrop.open{display:flex}
.pd-sheet{width:100%;max-width:560px;max-height:min(92dvh,900px);background:var(--pd-card);border-radius:22px 22px 0 0;border:1px solid var(--pd-border);border-bottom:0;display:flex;flex-direction:column;overflow:hidden;animation:sheetUp .22s ease}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.pd-sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--pd-border);flex-shrink:0}
.pd-sheet-body{overflow-y:auto;padding:16px;flex:1}
.pd-field label{display:block;font-size:11px;font-weight:800;color:var(--pd-muted);margin-bottom:5px}
.pd-field input,.pd-field select{width:100%;height:44px;border-radius:11px;border:1px solid var(--pd-border);background:var(--pd-bg);padding:0 12px;font-size:14px;font-weight:700;color:var(--pd-text);outline:none}
.pd-field{margin-bottom:12px}
.pd-check{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1px solid var(--pd-border);margin-bottom:8px;background:var(--pd-bg);cursor:pointer;font-size:13px;font-weight:700}
.pd-check input{width:18px;height:18px;accent-color:#059669}
.pd-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;border:0;font-size:14px;font-weight:800;cursor:pointer}
.pd-btn-primary{background:#059669;color:#fff;width:100%}
.pd-result{margin-top:16px;padding:18px;border-radius:16px;background:linear-gradient(135deg,#ecfdf5,#f0fdfa);border:1px solid #a7f3d0;text-align:center}
.dark .pd-result{background:linear-gradient(135deg,rgba(6,78,59,.35),rgba(15,23,42,.6));border-color:rgba(52,211,153,.3)}
.pd-result-label{font-size:11px;font-weight:800;color:var(--pd-muted);text-transform:uppercase;letter-spacing:.04em}
.pd-result-value{font-size:2.4rem;font-weight:900;color:#047857;line-height:1.1;margin:6px 0 2px}.dark .pd-result-value{color:#34d399}
.pd-result-unit{font-size:13px;font-weight:700;color:var(--pd-muted)}
.pd-result-badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:800;background:#dcfce7;color:#047857}
.dark .pd-result-badge{background:rgba(6,95,70,.4);color:#6ee7b7}
.pd-result-badge.warn{background:#fef3c7;color:#b45309}.dark .pd-result-badge.warn{background:rgba(146,64,14,.35);color:#fcd34d}
.pd-result-badge.danger{background:#fee2e2;color:#b91c1c}.dark .pd-result-badge.danger{background:rgba(127,29,29,.4);color:#fca5a5}
.pd-disclaimer{margin-top:14px;font-size:11px;font-weight:600;color:var(--pd-muted);line-height:1.5;text-align:center}
.pd-sample-btn{font-size:12px;font-weight:700;color:#059669;background:none;border:0;cursor:pointer;padding:0;margin-bottom:8px}.dark .pd-sample-btn{color:#34d399}
.pd-back{width:36px;height:36px;border-radius:10px;border:1px solid var(--pd-border);background:var(--pd-card);display:flex;align-items:center;justify-content:center;color:var(--pd-muted);cursor:pointer}
.view{display:none}.view.active{display:block}
.pd-power-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:480px){.pd-power-grid{grid-template-columns:repeat(4,1fr)}}
.pd-power-field label{font-size:10px}.pd-power-field input{height:40px;font-size:13px}
.pd-shortcut{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--pd-border);background:var(--pd-card);font-size:12px;font-weight:700;cursor:pointer}
.pd-shortcut i{color:#059669;width:18px;text-align:center}.dark .pd-shortcut i{color:#34d399}
.hidden{display:none!important}
:focus-visible{outline:2px solid #34d399;outline-offset:2px}
.space-y-2>*+*{margin-top:.5rem}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}.gap-2{gap:.5rem}.gap-2\.5{gap:.625rem}.gap-3{gap:.75rem}
.min-w-0{min-width:0}.shrink-0{flex-shrink:0}.flex-1{flex:1 1 0%}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px-4{padding-left:1rem;padding-right:1rem}.py-3{padding-top:.75rem;padding-bottom:.75rem}.pt-4{padding-top:1rem}.p-4{padding:1rem}.mb-2{margin-bottom:.5rem}.mb-2\.5{margin-bottom:.625rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}.mb-5{margin-bottom:1.25rem}.mt-0\.5{margin-top:.125rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}
.text-xl{font-size:1.25rem}.text-lg{font-size:1.125rem}.text-sm{font-size:.875rem}.text-xs{font-size:.75rem}.text-\[11px\]{font-size:11px}.font-extrabold{font-weight:800}.font-bold{font-weight:700}.font-semibold{font-weight:600}.leading-tight{line-height:1.25}
.text-slate-500{color:#64748b}.dark .text-slate-500{color:#94a3b8}.text-slate-400{color:#94a3b8}.text-emerald-600{color:#059669}.dark .text-emerald-300{color:#6ee7b7}
.bg-emerald-50{background:#ecfdf5}.dark .bg-emerald-900\/40{background:rgba(6,78,59,.4)}.bg-emerald-600{background:#059669}.text-white{color:#fff}
.w-9{width:2.25rem}.h-9{height:2.25rem}.w-10{width:2.5rem}.h-10{height:2.5rem}.rounded-xl{border-radius:.75rem}
.grid{display:grid}.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
</style>

<body>
<header class="pd-header">
<div class="pd-main px-4 py-3 flex items-center justify-between gap-3">
<div class="flex items-center gap-2.5 min-w-0">
<div class="pd-logo-mark">P</div>
<div class="min-w-0"><div class="pd-brand">PALDOSE</div><div class="pd-tagline" data-i18n="tagline">Better Decisions. Healthier Lives.</div></div>
</div>
<div class="flex items-center gap-2 shrink-0">
<button type="button" class="pd-icon-btn" id="btn-theme" aria-label="Toggle theme"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
<div class="pd-lang-toggle" role="group" aria-label="Language">
<button type="button" id="lang-ar">عربي</button>
<button type="button" id="lang-en" class="active">EN</button>
</div>
</div>
</div>
</header>

<main class="pd-main px-4 pt-4">
<section id="view-home" class="view active">
<div class="flex items-start gap-3 mb-4">
<div class="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-900/40 flex items-center justify-center text-emerald-600 dark:text-emerald-300 shrink-0"><i class="fa-solid fa-stethoscope text-lg"></i></div>
<div><h1 class="text-xl font-extrabold leading-tight" data-i18n="clinical_tools">Clinical Tools</h1><p class="text-xs font-semibold text-slate-500 mt-0.5" data-i18n="subtitle">Fast. Accurate. At your fingertips.</p></div>
</div>

<div class="pd-search-wrap mb-4"><i class="fa-solid fa-magnifying-glass pd-search-icon"></i><input type="search" id="search-input" class="pd-search" data-i18n-placeholder="search_placeholder" placeholder="Search for a tool..." autocomplete="off"/></div>

<div class="pd-card pd-power p-4 mb-5">
<div class="flex items-center gap-2 mb-3">
<div class="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center"><i class="fa-solid fa-bolt"></i></div>
<div class="flex-1 min-w-0"><div class="font-extrabold text-sm" data-i18n="power_ui">Power UI</div><div class="text-[11px] font-semibold text-slate-500" data-i18n="power_ui_sub">Your clinical assistant, smarter.</div></div>
</div>
<div class="pd-power-grid mb-3">
<div class="pd-field pd-power-field mb-0"><label data-i18n="age">Age</label><input type="number" id="pu-age" placeholder="e.g. 72"/></div>
<div class="pd-field pd-power-field mb-0"><label data-i18n="weight">Weight</label><input type="number" id="pu-wt" placeholder="kg"/></div>
<div class="pd-field pd-power-field mb-0"><label data-i18n="height">Height</label><input type="number" id="pu-ht" placeholder="cm"/></div>
<div class="pd-field pd-power-field mb-0"><label data-i18n="creatinine">Creatinine</label><input type="number" id="pu-cr" placeholder="mg/dL" step="0.01"/></div>
</div>
<button type="button" class="pd-btn pd-btn-primary mb-3" id="power-recommend"><i class="fa-solid fa-bolt"></i> <span data-i18n="get_recommended">Get Recommended Tools</span></button>
<div class="text-[11px] font-bold text-slate-500 mb-2" data-i18n="quick_access">Quick Access</div>
<div class="grid grid-cols-2 gap-2" id="power-shortcuts"></div>
</div>

<div class="mb-5">
<div class="flex items-center justify-between mb-2.5"><div class="pd-section-title"><i class="fa-solid fa-star text-amber-400"></i><span data-i18n="favorites">Favorites</span></div><button type="button" class="pd-link" id="fav-manage" data-i18n="manage">Manage</button></div>
<div id="favorites-home" class="pd-fav-grid"></div>
<div id="favorites-empty" class="pd-empty hidden" data-i18n="fav_empty">Tap ⭐ beside any tool to add it to Favorites.</div>
</div>

<div class="mb-5"><div class="pd-section-title mb-2.5"><span data-i18n="all_tools">All Tools</span></div><div class="pd-cat-grid" id="categories-grid"></div></div>

<div class="mb-4">
<div class="flex items-center justify-between mb-2.5"><div class="pd-section-title"><i class="fa-regular fa-clock"></i><span data-i18n="recent">Recent Tools</span></div><button type="button" class="pd-link" id="recent-clear" data-i18n="clear_all">Clear all</button></div>
<div id="recent-list" class="space-y-2"></div>
<div id="recent-empty" class="pd-empty hidden" data-i18n="recent_empty">No recent tools yet.</div>
</div>
</section>

<section id="view-list" class="view">
<div class="flex items-center gap-3 mb-4">
<button type="button" class="pd-back" id="list-back" aria-label="Back"><i class="fa-solid fa-chevron-left" id="list-back-icon"></i></button>
<div class="min-w-0 flex-1"><h2 class="text-lg font-extrabold truncate" id="list-title">Category</h2><p class="text-xs font-semibold text-slate-500" id="list-subtitle"></p></div>
</div>
<div class="pd-search-wrap mb-3"><i class="fa-solid fa-magnifying-glass pd-search-icon"></i><input type="search" id="list-search" class="pd-search" data-i18n-placeholder="search_in" placeholder="Search in list..." autocomplete="off"/></div>
<div id="list-tools" class="space-y-2"></div>
<div id="list-empty" class="pd-empty hidden" data-i18n="no_results">No tools found.</div>
</section>
</main>

<nav class="pd-bottom-nav" aria-label="Main">
<button type="button" class="pd-nav-item" data-nav="home"><i class="fa-solid fa-house"></i><span data-i18n="nav_home">Home</span></button>
<button type="button" class="pd-nav-item" data-nav="drugs"><i class="fa-solid fa-pills"></i><span data-i18n="nav_drugs">Drugs</span></button>
<button type="button" class="pd-nav-item active" data-nav="tools"><i class="fa-solid fa-stethoscope"></i><span data-i18n="nav_tools">Clinical Tools</span></button>
<button type="button" class="pd-nav-item" data-nav="saved"><i class="fa-regular fa-bookmark"></i><span data-i18n="nav_saved">Saved</span></button>
<button type="button" class="pd-nav-item" data-nav="more"><i class="fa-solid fa-ellipsis"></i><span data-i18n="nav_more">More</span></button>
</nav>

<div class="pd-sheet-backdrop" id="tool-sheet" role="dialog" aria-modal="true">
<div class="pd-sheet">
<div class="pd-sheet-head">
<button type="button" class="pd-back" id="sheet-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
<div class="min-w-0 flex-1"><h3 class="font-extrabold text-base truncate" id="sheet-title">Tool</h3><p class="text-[11px] font-semibold text-slate-500 truncate" id="sheet-sub"></p></div>
<button type="button" class="pd-star" id="sheet-star" aria-label="Favorite"><i class="fa-solid fa-star"></i></button>
</div>
<div class="pd-sheet-body" id="sheet-body"></div>
</div>
</div>

<script>
(function(){
'use strict';

let favorites=JSON.parse(localStorage.getItem('pd_ct_favorites')||'[]');
let recent=JSON.parse(localStorage.getItem('pd_ct_recent')||'[]');
let currentList={type:'home'};
let activeToolId=null;
function saveFav(){localStorage.setItem('pd_ct_favorites',JSON.stringify(favorites))}
function saveRecent(){localStorage.setItem('pd_ct_recent',JSON.stringify(recent.slice(0,12)))}
function isFav(id){return favorites.includes(id)}
function toggleFav(id){if(isFav(id))favorites=favorites.filter(x=>x!==id);else favorites=[id,...favorites.filter(x=>x!==id)];saveFav();renderAll();if(activeToolId===id)updateSheetStar()}
function pushRecent(id){recent=[id,...recent.filter(x=>x!==id)].slice(0,8);saveRecent()}
function toolById(id){return TOOLS.find(t=>t.id===id)}
function catById(id){return CATEGORIES.find(c=>c.id===id)}
function toolsInCat(catId){return TOOLS.filter(t=>t.cat===catId)}
function nameOf(tool){return lang==='ar'?tool.ar:tool.en}
function descOf(tool){return lang==='ar'?tool.descAr:tool.descEn}
function catName(c){return lang==='ar'?c.ar:c.en}

function renderCategories(){
const el=document.getElementById('categories-grid');
el.innerHTML=CATEGORIES.map(c=>{
const n=toolsInCat(c.id).length;
return `<button type="button" class="pd-cat-card" style="${c.color};${c.border};border-width:1px;border-style:solid" data-cat="${c.id}">
<div class="pd-cat-icon" style="${c.iconBg}"><i class="fa-solid ${c.icon}"></i></div>
<div class="min-w-0" style="text-align:start"><div class="pd-cat-name">${catName(c)}</div><div class="pd-cat-count">${n} ${t('tools_count')}</div></div>
<i class="fa-solid fa-chevron-${lang==='ar'?'left':'right'} pd-cat-arrow"></i></button>`}).join('');
el.querySelectorAll('[data-cat]').forEach(btn=>btn.addEventListener('click',()=>openCategory(btn.getAttribute('data-cat'))))}

function renderFavoritesHome(){
const grid=document.getElementById('favorites-home');const empty=document.getElementById('favorites-empty');
const favTools=favorites.map(toolById).filter(Boolean);
if(!favTools.length){grid.innerHTML='';empty.classList.remove('hidden');return}
empty.classList.add('hidden');
grid.innerHTML=favTools.slice(0,10).map(tool=>`<button type="button" class="pd-fav-item" data-open="${tool.id}"><i class="fa-solid ${tool.icon}"></i><span>${nameOf(tool)}</span></button>`).join('');
grid.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openTool(b.getAttribute('data-open'))))}

function toolRowHTML(tool){
const cat=catById(tool.cat);
return `<div class="pd-tool-row" data-open="${tool.id}">
<div class="pd-tool-icon"><i class="fa-solid ${tool.icon}"></i></div>
<div class="pd-tool-body"><div class="pd-tool-name">${nameOf(tool)}</div><div class="pd-tool-desc">${descOf(tool)}</div><div class="pd-tool-cat">${cat?catName(cat):''}</div></div>
<button type="button" class="pd-star ${isFav(tool.id)?'is-fav':''}" data-fav="${tool.id}" aria-label="Favorite"><i class="fa-solid fa-star"></i></button>
<i class="fa-solid fa-chevron-${lang==='ar'?'left':'right'} pd-chevron"></i></div>`}

function bindToolRows(root){
root.querySelectorAll('[data-open]').forEach(row=>{row.addEventListener('click',e=>{if(e.target.closest('[data-fav]'))return;openTool(row.getAttribute('data-open'))})});
root.querySelectorAll('[data-fav]').forEach(btn=>{btn.addEventListener('click',e=>{e.stopPropagation();toggleFav(btn.getAttribute('data-fav'))})})}

function renderRecent(){
const list=document.getElementById('recent-list');const empty=document.getElementById('recent-empty');
const items=recent.map(toolById).filter(Boolean).slice(0,5);
if(!items.length){list.innerHTML='';empty.classList.remove('hidden');return}
empty.classList.add('hidden');list.innerHTML=items.map(toolRowHTML).join('');bindToolRows(list)}

function renderPowerShortcuts(){
const shortcuts=[{id:'cockcroft',icon:'fa-kidneys',en:'Renal Function',ar:'وظيفة الكلية'},{id:'qtc',icon:'fa-wave-square',en:'QTc',ar:'QTc'},{id:'map',icon:'fa-gauge-high',en:'MAP',ar:'MAP'},{id:'bmi',icon:'fa-weight-scale',en:'BMI',ar:'BMI'},{id:'abg',icon:'fa-lungs',en:'ABG Analyzer',ar:'غازات الدم'},{id:'drug_interaction',icon:'fa-link',en:'Drug Interaction',ar:'تداخل الأدوية'},{id:'ped_dose',icon:'fa-child',en:'Pediatric Dose',ar:'جرعة أطفال'},{id:'anion_gap',icon:'fa-flask-vial',en:'Anion Gap',ar:'فجوة الأنيون'}];
const el=document.getElementById('power-shortcuts');
el.innerHTML=shortcuts.map(s=>`<button type="button" class="pd-shortcut" data-open="${s.id}"><i class="fa-solid ${s.icon}"></i><span>${lang==='ar'?s.ar:s.en}</span></button>`).join('');
el.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openTool(b.getAttribute('data-open'))))}

function renderAll(){renderCategories();renderFavoritesHome();renderRecent();renderPowerShortcuts();if(currentList.type!=='home')renderListView()}

function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active')}
function openCategory(catId){const c=catById(catId);currentList={type:'category',catId};document.getElementById('list-title').textContent=catName(c);document.getElementById('list-subtitle').textContent=toolsInCat(catId).length+' '+t('tools_count');document.getElementById('list-search').value='';showView('view-list');renderListView()}
function openFavoritesList(){currentList={type:'favorites'};document.getElementById('list-title').textContent=t('favorites');document.getElementById('list-subtitle').textContent=favorites.length+' '+t('tools_count');document.getElementById('list-search').value='';showView('view-list');renderListView()}
function matchesQuery(tool,q){if(!q)return true;const blob=[tool.en,tool.ar,tool.descEn,tool.descAr,catName(catById(tool.cat)||{en:'',ar:''})].join(' ').toLowerCase();return blob.includes(q)}
function filterTools(q){return TOOLS.filter(t=>matchesQuery(t,q))}
function renderListView(){
let tools=[];
if(currentList.type==='category')tools=toolsInCat(currentList.catId);
else if(currentList.type==='favorites')tools=favorites.map(toolById).filter(Boolean);
else if(currentList.type==='search')tools=filterTools((document.getElementById('search-input').value||'').trim().toLowerCase());
const q2=(document.getElementById('list-search').value||'').trim().toLowerCase();
if(q2)tools=tools.filter(tool=>matchesQuery(tool,q2));
const list=document.getElementById('list-tools');const empty=document.getElementById('list-empty');
if(!tools.length){list.innerHTML='';empty.classList.remove('hidden');return}
empty.classList.add('hidden');list.innerHTML=tools.map(toolRowHTML).join('');bindToolRows(list)}

function openTool(id){
const tool=toolById(id);if(!tool)return;activeToolId=id;pushRecent(id);
document.getElementById('sheet-title').textContent=nameOf(tool);
document.getElementById('sheet-sub').textContent=descOf(tool);
updateSheetStar();
const body=document.getElementById('sheet-body');
body.innerHTML=buildToolForm(tool);
document.getElementById('tool-sheet').classList.add('open');
bindToolForm(tool);renderRecent()}
function updateSheetStar(){document.getElementById('sheet-star').classList.toggle('is-fav',isFav(activeToolId))}
function closeSheet(){document.getElementById('tool-sheet').classList.remove('open');activeToolId=null}

function buildToolForm(tool){
let html=`<button type="button" class="pd-sample-btn" id="btn-sample"><i class="fa-solid fa-wand-magic-sparkles"></i> ${t('load_sample')} — ${t('demo_data')}</button><div id="tool-fields">`;
(tool.fields||[]).forEach(f=>{
const label=lang==='ar'?f.ar:f.en;
if(f.type==='check')html+=`<label class="pd-check"><input type="checkbox" id="f-${f.id}" data-field="${f.id}"/> <span>${label}</span></label>`;
else if(f.type==='select'){html+=`<div class="pd-field"><label for="f-${f.id}">${label}</label><select id="f-${f.id}" data-field="${f.id}">`;(f.options||[]).forEach(o=>{html+=`<option value="${o.v}">${lang==='ar'?o.ar:o.en}</option>`});html+=`</select></div>`}
else if(f.type==='text')html+=`<div class="pd-field"><label for="f-${f.id}">${label}</label><input type="text" id="f-${f.id}" data-field="${f.id}" placeholder="${f.placeholder||''}"/></div>`;
else html+=`<div class="pd-field"><label for="f-${f.id}">${label}</label><input type="number" id="f-${f.id}" data-field="${f.id}" inputmode="decimal"/></div>`});
html+=`</div><button type="button" class="pd-btn pd-btn-primary mt-2" id="btn-calc"><i class="fa-solid fa-calculator"></i> ${tool.type==='interaction'||tool.id==='drug_interaction'?t('check_interaction'):t('calculate')}</button><div id="tool-result"></div><p class="pd-disclaimer">${t('disclaimer')}</p>`;
return html}
function readFields(tool){const vals={};(tool.fields||[]).forEach(f=>{const el=document.getElementById('f-'+f.id);if(!el)return;if(f.type==='check')vals[f.id]=el.checked;else if(f.type==='number')vals[f.id]=el.value===''?null:+el.value;else vals[f.id]=el.value});return vals}
function fillSample(tool){const s=tool.sample||{};(tool.fields||[]).forEach(f=>{const el=document.getElementById('f-'+f.id);if(!el||s[f.id]===undefined)return;if(f.type==='check')el.checked=!!s[f.id];else el.value=s[f.id]})}
function bindToolForm(tool){
document.getElementById('btn-sample').addEventListener('click',()=>fillSample(tool));
document.getElementById('btn-calc').addEventListener('click',()=>{
const vals=readFields(tool);const res=tool.calc?tool.calc(vals):null;const box=document.getElementById('tool-result');
if(!res){box.innerHTML=`<div class="pd-result"><div class="pd-result-label">${t('result')}</div><div class="pd-result-value">—</div></div>`;return}
let extra='';
if(res.extra)extra=`<div class="mt-3" style="text-align:start;font-size:12px;font-weight:600;line-height:1.5"><div><strong>${t('mechanism')}:</strong> ${res.extra.mechanism}</div><div><strong>${t('management')}:</strong> ${res.extra.management}</div><div><strong>${t('source')}:</strong> ${res.extra.source}</div></div>`;
box.innerHTML=`<div class="pd-result"><div class="pd-result-label">${t('result')}</div><div class="pd-result-value">${res.value}</div><div class="pd-result-unit">${res.unit||''}</div>${res.badge?`<div class="pd-result-badge ${res.badgeClass||''}">${res.badge}</div>`:''}${extra}</div>`})}

document.getElementById('lang-en').addEventListener('click',()=>setLang('en'));
document.getElementById('lang-ar').addEventListener('click',()=>setLang('ar'));
document.getElementById('btn-theme').addEventListener('click',()=>setTheme(theme==='dark'?'light':'dark'));
document.getElementById('list-back').addEventListener('click',()=>{showView('view-home');currentList={type:'home'}});
document.getElementById('sheet-close').addEventListener('click',closeSheet);
document.getElementById('tool-sheet').addEventListener('click',e=>{if(e.target.id==='tool-sheet')closeSheet()});
document.getElementById('sheet-star').addEventListener('click',()=>{if(activeToolId)toggleFav(activeToolId)});
document.getElementById('fav-manage').addEventListener('click',openFavoritesList);
document.getElementById('recent-clear').addEventListener('click',()=>{recent=[];saveRecent();renderRecent()});
document.getElementById('list-search').addEventListener('input',renderListView);
document.getElementById('search-input').addEventListener('input',e=>{const q=e.target.value.trim();if(!q){showView('view-home');return}currentList={type:'search'};document.getElementById('list-title').textContent=q;document.getElementById('list-subtitle').textContent=filterTools(q.toLowerCase()).length+' '+t('tools_count');document.getElementById('list-search').value='';showView('view-list');renderListView()});
document.getElementById('power-recommend').addEventListener('click',()=>{const age=+document.getElementById('pu-age').value;const rec=[];if(age||document.getElementById('pu-wt').value||document.getElementById('pu-cr').value)rec.push('cockcroft','egfr_ckd','bmi');if(age>=65)rec.push('cha2ds2vasc','hasbled');rec.push('qtc','map','abg');const unique=[...new Set(rec)].slice(0,6);currentList={type:'search'};document.getElementById('list-title').textContent=t('recommended');document.getElementById('list-subtitle').textContent=unique.length+' '+t('tools_count');const list=document.getElementById('list-tools');list.innerHTML=unique.map(id=>toolById(id)).filter(Boolean).map(toolRowHTML).join('');bindToolRows(list);document.getElementById('list-empty').classList.add('hidden');showView('view-list')});
document.querySelectorAll('.pd-nav-item').forEach(btn=>{btn.addEventListener('click',()=>{const nav=btn.getAttribute('data-nav');if(nav==='tools'||nav==='home'){showView('view-home');currentList={type:'home'};document.querySelectorAll('.pd-nav-item').forEach(b=>b.classList.remove('active'));document.querySelector('[data-nav="tools"]').classList.add('active')}else if(nav==='saved'){openFavoritesList();document.querySelectorAll('.pd-nav-item').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}})});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
setTheme(theme);setLang(lang);renderAll();
})();
</script>
</body>
</html>
