const cats=[{"id": "scores", "en": "Clinical Scores", "ar": "الدرجات السريرية", "icon": "fa-chart-line", "tone": "blue"}, {"id": "dosing", "en": "Medication & Dosing", "ar": "الأدوية والجرعات", "icon": "fa-pills", "tone": "green"}, {"id": "acute", "en": "Emergency / Acute", "ar": "الطوارئ والحالات الحادة", "icon": "fa-truck-medical", "tone": "rose"}, {"id": "labs", "en": "Laboratory", "ar": "المختبر", "icon": "fa-flask", "tone": "purple"}, {"id": "cardio", "en": "Cardiology", "ar": "أمراض القلب", "icon": "fa-heart-pulse", "tone": "orange"}, {"id": "peds", "en": "Pediatrics", "ar": "طب الأطفال", "icon": "fa-child-reaching", "tone": "teal"}, {"id": "interaction", "en": "Drug Interaction", "ar": "التداخلات الدوائية", "icon": "fa-link", "tone": "violet"}];
let lang=localStorage.getItem('paldose-lang')||'en';
let favorites=JSON.parse(localStorage.getItem('paldose-clinical-favorites')||'[]').filter(id=>tools.some(t=>t.id===id));

let activeCat=null;
function C(id){return cats.find(x=>x.id===id)||cats[0]}
function name(t){return lang==='ar'?t.ar:t.en}
function desc(t){return lang==='ar'?t.descAr:t.descEn}
function cname(id){let c=C(id);return lang==='ar'?c.ar:c.en}
function save(){localStorage.setItem('paldose-clinical-favorites',JSON.stringify(favorites));localStorage.setItem('paldose-clinical-recent',JSON.stringify(recent))}
function toggleFavorite(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[id,...favorites];save();renderHome();if(activeCat)renderCategory()}
function addRecent(id){recent=[id,...recent.filter(x=>x!==id)].slice(0,5);save()}
function clearRecent(){recent=[];save();renderHome()}
function toolRow(t){let f=favorites.includes(t.id);return `<article class="tool-row"><button class="tool-main" onclick="openTool('${t.id}')"><span class="tool-icon"><i class="fa-solid ${t.icon}"></i></span><span class="tool-copy"><span class="tool-name">${name(t)}</span><span class="tool-desc">${desc(t)}</span><span class="tool-cat">${cname(t.cat)}</span></span><span class="tool-arrow"><i class="fa-solid fa-chevron-right"></i></span></button><button class="tool-fav ${f?'is-fav':''}" onclick="event.stopPropagation();toggleFavorite('${t.id}')"><i class="${f?'fa-solid':'fa-regular'} fa-star"></i></button></article>`}
function renderHome(){
 let q=document.getElementById('search').value.toLowerCase().trim();
 document.getElementById('toolCount').textContent=lang==='ar'?tools.length+' أداة':tools.length+' tools';
 document.getElementById('categoryList').innerHTML=cats.map(c=>{let n=tools.filter(t=>t.cat===c.id).length;return `<button class="category ${c.tone}" onclick="openCategory('${c.id}')"><span class="cat-icon"><i class="fa-solid ${c.icon}"></i></span><span class="cat-copy"><strong>${lang==='ar'?c.ar:c.en}</strong><span>${lang==='ar'?'أدوات سريرية':'Clinical tools'}</span></span><span class="cat-count">${n}</span><span class="chev"><i class="fa-solid fa-chevron-right"></i></span></button>`}).join('');
 let fav=favorites.map(id=>tools.find(t=>t.id===id)).filter(Boolean);
 document.getElementById('favoritesStrip').innerHTML=fav.length?fav.map(t=>`<button class="fav-chip" onclick="openTool('${t.id}')"><i class="fa-solid ${t.icon}"></i><span>${name(t)}</span><em>${cname(t.cat)}</em></button>`).join(''):`<div class="empty-fav">${lang==='ar'?'اضغط ⭐ بجانب أي أداة لتثبيتها هنا.':'Tap ⭐ beside any tool to pin it here.'}</div>`;
 let rr=recent.map(id=>tools.find(t=>t.id===id)).filter(Boolean);
 document.getElementById('recentSection').style.display=rr.length?'block':'none';
 document.getElementById('recentList').innerHTML=rr.map(t=>`<button class="recent-row" onclick="openTool('${t.id}')"><span class="tool-icon"><i class="fa-solid ${t.icon}"></i></span><span class="recent-copy"><strong>${name(t)}</strong><span>${cname(t.cat)}</span></span><span class="tool-arrow"><i class="fa-solid fa-chevron-right"></i></span></button>`).join('');
 if(q){let matches=tools.filter(t=>(t.en+' '+t.ar+' '+t.descEn+' '+t.descAr).toLowerCase().includes(q));document.getElementById('categoryList').innerHTML=matches.length?matches.map(toolRow).join(''):`<div class="empty-fav">${lang==='ar'?'لا توجد نتائج.':'No matching tools.'}</div>`}
}
function openCategory(id){activeCat=id;document.getElementById('homeView').classList.remove('active');document.getElementById('categoryView').classList.add('active');let c=C(id);document.getElementById('catTitle').textContent=lang==='ar'?c.ar:c.en;document.getElementById('catSub').textContent=lang==='ar'?tools.filter(t=>t.cat===id).length+' أدوات':tools.filter(t=>t.cat===id).length+' tools';document.getElementById('catIcon').innerHTML='<i class="fa-solid '+c.icon+'"></i>';document.getElementById('catSearch').value='';renderCategory()}
function renderCategory(){if(activeCat==='__favorites__')return renderFavoritePage();let q=document.getElementById('catSearch').value.toLowerCase().trim();let list=tools.filter(t=>t.cat===activeCat).filter(t=>(t.en+' '+t.ar+' '+t.descEn+' '+t.descAr).toLowerCase().includes(q));document.getElementById('categoryTools').innerHTML=list.map(toolRow).join('')||`<div class="empty-fav">${lang==='ar'?'لا توجد نتائج.':'No matching tools.'}</div>`}
function showFavorites(){activeCat='__favorites__';document.getElementById('homeView').classList.remove('active');document.getElementById('categoryView').classList.add('active');document.getElementById('catTitle').textContent=lang==='ar'?'المفضلة':'Favorites';document.getElementById('catSub').textContent=lang==='ar'?favorites.length+' أدوات مثبتة':favorites.length+' pinned tools';document.getElementById('catIcon').innerHTML='<i class="fa-solid fa-star"></i>';document.getElementById('catSearch').value='';renderFavoritePage()}
function renderFavoritePage(){let q=document.getElementById('catSearch').value.toLowerCase().trim();let list=favorites.map(id=>tools.find(t=>t.id===id)).filter(Boolean).filter(t=>(t.en+' '+t.ar+' '+t.descEn+' '+t.descAr).toLowerCase().includes(q));document.getElementById('categoryTools').innerHTML=list.map(toolRow).join('')||`<div class="empty-fav">${lang==='ar'?'لم تضف أي أداة للمفضلة بعد.':'No favorite tools yet.'}</div>`}
function openTool(id){let t=tools.find(x=>x.id===id);if(!t)return;addRecent(id);document.getElementById('mTitle').textContent=name(t);document.getElementById('mSub').textContent=lang==='ar'?'واجهة جاهزة للـBackend':'Backend-ready frontend shell';document.getElementById('mIcon').innerHTML='<i class="fa-solid '+t.icon+'"></i>';document.getElementById('mBody').innerHTML=id==='ddi'?ddiMarkup():genericMarkup(t);document.getElementById('modal').classList.add('open')}
function genericMarkup(t){let l=lang==='en';let fields=['Patient age|عمر المريض','Weight|الوزن','Height|الطول','Systolic BP|الضغط الانقباضي','Diastolic BP|الضغط الانبساطي','Heart rate|معدل القلب','Creatinine|الكرياتينين','Sodium|الصوديوم'];let n=['bmi','bsa','ibw','adjbw','map','shock','pp'].includes(t.id)?2:['chads','hasbled','heart','timi','grace'].includes(t.id)?6:['cockcroft','egfr','renaldose','pedsgrf'].includes(t.id)?5:['abg','winter','aagrad','pf','osmol','osmgap','anion','deltagap'].includes(t.id)?5:4;return `<div class="preview"><strong>${l?'Clinical Tool':'أداة سريرية'}</strong><p>${desc(t)}</p></div><div class="form-grid">${fields.slice(0,n).map(x=>{let a=x.split('|');return `<div class="field"><label>${l?a[0]:a[1]}</label><input placeholder="${l?'Enter value':'أدخل القيمة'}"></div>`}).join('')}</div><div class="action"><button class="primary"><i class="fa-solid fa-calculator"></i> ${l?'Calculate':'احسب'}</button><button class="secondary">${l?'Reset':'إعادة'}</button></div><div class="preview"><strong>${l?'Result preview':'معاينة النتيجة'}</strong><p>${l?'Frontend only — connect the calculation engine later.':'واجهة فقط — يمكن ربط محرك الحسابات لاحقاً.'}</p></div><div class="note">${l?'Verify units, inputs and clinical context before use.':'تحقق من الوحدات والمدخلات والسياق السريري قبل الاستخدام.'}</div>`}
function ddiMarkup(){let l=lang==='en';return `<div class="form-grid"><div class="field"><label>${l?'Drug 1':'الدواء الأول'}</label><input placeholder="${l?'e.g. Cataflam':'مثال: Cataflam'}"></div><div class="field"><label>${l?'Drug 2':'الدواء الثاني'}</label><input placeholder="${l?'e.g. Ibuprofen':'مثال: Ibuprofen'}"></div></div><div class="action"><button class="primary"><i class="fa-solid fa-shield-heart"></i> ${l?'Check Interaction':'فحص التداخل'}</button><button class="secondary">${l?'Clear':'مسح'}</button></div><div class="preview"><strong>${l?'Interaction result':'نتيجة التداخل'}</strong><p>${l?'Frontend placeholder: DDInter → RxNorm → openFDA fallback.':'واجهة جاهزة: DDInter → RxNorm → openFDA كخيار احتياطي.'}</p></div>`}
function openPower(){let l=lang==='en';document.getElementById('mTitle').textContent='Power UI';document.getElementById('mSub').textContent=l?'Smart clinical workspace':'مساحة سريرية ذكية';document.getElementById('mIcon').innerHTML='<i class="fa-solid fa-bolt"></i>';let ids=['bmi','cockcroft','qtc','abg','fluiddef','peddose'];document.getElementById('mBody').innerHTML=`<div class="preview"><strong>${l?'Quick Patient Input':'إدخال سريع لبيانات المريض'}</strong><p>${l?'Enter common values once. The backend can later share this context across tools.':'أدخل القيم الشائعة مرة واحدة. يمكن لاحقاً مشاركة البيانات مع الأدوات.'}</p></div><div class="form-grid"><div class="field"><label>${l?'Age':'العمر'}</label><input placeholder="e.g. 72"></div><div class="field"><label>${l?'Weight':'الوزن'}</label><input placeholder="e.g. 70 kg"></div><div class="field"><label>${l?'Height':'الطول'}</label><input placeholder="e.g. 170 cm"></div><div class="field"><label>${l?'Creatinine':'الكرياتينين'}</label><input placeholder="e.g. 1.0"></div><div class="field"><label>${l?'Heart Rate':'معدل القلب'}</label><input placeholder="bpm"></div><div class="field"><label>${l?'SBP / DBP':'الضغط'}</label><input placeholder="120 / 80"></div></div><div class="action"><button class="primary"><i class="fa-solid fa-bolt"></i> ${l?'Get Recommended Tools':'إظهار الأدوات المقترحة'}</button></div><div class="power-grid">${ids.map(id=>{let t=tools.find(x=>x.id===id);return '<button class="quick" onclick="openTool(\\''+id+'\\')"><i class="fa-solid '+t.icon+'"></i>'+name(t)+'</button>'}).join('')}</div>`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function goHome(){activeCat=null;document.getElementById('categoryView').classList.remove('active');document.getElementById('homeView').classList.add('active');renderHome()}
function focusSearch(){goHome();setTimeout(()=>document.getElementById('search').focus(),50)}
function toggleTheme(){document.documentElement.classList.toggle('dark');let d=document.documentElement.classList.contains('dark');localStorage.setItem('paldose-clinical-theme',d?'dark':'light');document.getElementById('themeIcon').className=d?'fa-solid fa-sun':'fa-solid fa-moon'}
function applyLang(){document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.documentElement.lang=lang;document.getElementById('langBtn').textContent=lang==='ar'?'English':'عربي';document.querySelectorAll('[data-en]').forEach(e=>e.textContent=lang==='ar'?e.dataset.ar:e.dataset.en);renderHome();if(activeCat==='__favorites__')showFavorites();else if(activeCat)openCategory(activeCat)}
function toggleLang(){lang=lang==='en'?'ar':'en';localStorage.setItem('paldose-lang',lang);applyLang()}
if(localStorage.getItem('paldose-clinical-theme')==='dark'){document.documentElement.classList.add('dark');document.getElementById('themeIcon').className='fa-solid fa-sun'}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
applyLang();
</script>
</body></html>
