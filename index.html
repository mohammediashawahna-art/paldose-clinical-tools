{id:'egfr_ckd',cat:'meds',icon:'fa-kidneys',en:'eGFR (CKD-EPI)',ar:'eGFR (CKD-EPI)',descEn:'Estimated GFR',descAr:'معدل الترشيح الكبيبي',

sample:{drug1:'Cataflam',drug2:'Ibuprofen'},

const a=(v.drug1||'').toLowerCase(),b=(v.drug2||'').toLowerCase();
const pairs=[
{keys:['warfarin','aspirin'],sev:'Major',mech:'Additive anticoagulant/antiplatelet effect',mgmt:'Avoid or monitor bleeding closely.'},
{keys:['ibuprofen','cataflam'],sev:'Major',mech:'Duplicate NSAID — additive GI/renal toxicity',mgmt:'Avoid concurrent systemic NSAIDs.'},
{keys:['simvastatin','clarithromycin'],sev:'Major',mech:'CYP3A4 inhibition raises statin levels',mgmt:'Avoid combination; hold or switch statin.'},
{keys:['metformin','contrast'],sev:'Moderate',mech:'Lactic acidosis risk with renal impairment',mgmt:'Hold metformin around iodinated contrast per protocol.'}
];
for(const p of pairs){if(p.keys.every(k=>a.includes(k)||b.includes(k)))return{value:p.sev,unit:'',badge:p.sev,badgeClass:p.sev==='Major'?'danger':'warn',extra:{mechanism:p.mech,management:p.mgmt,source:'Frontend sample / Backend Required'}}}
return{value:'No sample pair matched',unit:'',badge:'No canned interaction for this pair',extra:{mechanism:'—',management:'Use a validated interaction database in production.',source:'Frontend sample / Backend Required'}}
}}
];

function yesNoField(f){
  return {id:f.id,type:'radio',en:f.en,ar:f.ar,options:[
    {v:'no',en:'No',ar:'لا',points:0},
    {v:'yes',en:'Yes',ar:'نعم',points:f.points||1}
  ]};
}
function radioField(id,en,ar,options){return {id,type:'radio',en,ar,options};}
function replaceFields(id,fields){
  const x=toolById(id); if(x) x.fields=fields;
}
function convertScoreChecks(id){
  const x=toolById(id); if(!x)return;
  x.fields=(x.fields||[]).map(f=>f.type==='check'?yesNoField(f):f);
  if(x.sample) Object.keys(x.sample).forEach(k=>{if(x.sample[k]===1)x.sample[k]='yes';else if(x.sample[k]===0)x.sample[k]='no'});

function calcHeart(v){
 if(v.history==null||v.ecg==null||v.age==null||v.trop==null||v.uln==null||v.uln<=0)return null;
 const h=+v.history,e=+v.ecg,a=v.age<45?0:v.age<65?1:2;
 const rf=['htn','hyper','dm','obesity','smoking','family','vascular'].filter(k=>v[k]).length;
 const r=rf===0?0:rf<=2?1:2, tr=v.trop/v.uln<=1?0:v.trop/v.uln<=3?1:2, total=h+e+a+r+tr;
 return {value:total+' / 10',unit:'',badge:total>=7?'High risk':total>=4?'Moderate risk':'Low risk',badgeClass:total>=7?'danger':total>=4?'warn':'',breakdown:[['History',h],['ECG',e],['Age',a],['Risk factors',r],['Troponin',tr]].map(x=>({label:x[0],value:x[1]})),formula:'HEART = History + ECG + Age + Risk factors + Troponin. Troponin: ≤1× ULN=0; >1–3×=1; >3×=2.'};
}
function calcNews2(v){
 if([v.rr,v.spo2,v.sbp,v.hr,v.temp].some(x=>x==null||!Number.isFinite(+x)))return null;
 const rr=+v.rr,sp=+v.spo2,sb=+v.sbp,hr=+v.hr,tp=+v.temp;
 const a=rr<=8||rr>=25?3:rr<=11?1:rr<=20?0:2;
 const b=sp<=91?3:sp<=93?2:sp<=95?1:0;
 const c=sb<=90?3:sb<=100?2:sb<=110?1:sb<=219?0:3;
 const d=hr<=40?3:hr<=50?1:hr<=90?0:hr<=110?1:hr<=130?2:3;
 const e=tp<=35?3:tp<=36?1:tp<=38?0:tp<=39?1:2;
 const o=v.o2?2:0,total=a+b+c+d+e+o;
 return {value:total+'/20',unit:'',badge:total>=7?'High':total>=5?'Medium':total>=1?'Low':'Low',badgeClass:total>=7?'danger':total>=5?'warn':'',breakdown:[['Respiratory rate',a],['SpO₂',b],['Supplemental O₂',o],['SBP',c],['Heart rate',d],['Temperature',e]].map(x=>({label:x[0],value:x[1]})),formula:'NEWS2 standard scoring, SpO₂ Scale 1.'};
}
function calcHcmRisk(v){
 const req=['age','wall','la','lvot'];if(req.some(k=>v[k]==null||!Number.isFinite(+v[k])))return null;
 const age=+v.age,m=+v.wall,la=+v.la,lv=+v.lvot;
 const pi=.15939858*m-.00294271*m*m+.0259082*la+.00446131*lv+.4583082*(v.family==='yes'?1:0)+.82639195*(v.nsvt==='yes'?1:0)+.71650361*(v.syncope==='yes'?1:0)-.01799934*age;
 const risk=(1-Math.pow(.998,Math.exp(pi)))*100;
 return {value:risk.toFixed(1)+'%',unit:'5-year SCD risk',badge:risk>=6?'High risk':risk>=4?'Intermediate risk':'Low risk',badgeClass:risk>=6?'danger':risk>=4?'warn':'',breakdown:[['Prognostic index',pi.toFixed(3)]],formula:'2014 ESC HCM Risk-SCD model: P=1−0.998^exp(PI), using wall thickness, LA diameter, LVOT gradient, family history, NSVT, syncope and age.'};
}
function calcGrace(v){
 const vals=['age','hr','sbp','creat'];if(vals.some(k=>v[k]==null||!Number.isFinite(+v[k])))return null;
 let s=0,a=+v.age,h=+v.hr,b=+v.sbp,c=+v.creat;
 s+=a<30?0:a<40?8:a<50?25:a<60?41:a<70?58:a<80?75:91;
 s+=h<50?0:h<70?3:h<90?9:h<110?15:h<150?24:h<200?38:46;

 s+=pts(na,[[180,999,4],[160,179,3],[155,159,2],[150,154,1],[130,149,0],[120,129,2],[111,119,3],[-99,110,4]]);
 s+=pts(k,[[7,999,4],[6,6.999,3],[5.5,5.999,1],[3.5,5.499,0],[3,3.499,1],[2.5,2.999,2],[-99,2.499,4]]);
 let cp=pts(cr,[[3.5,999,4],[2,3.499,3],[1.5,1.999,2],[.6,1.499,0],[-99,.599,2]]);if(v.arfr==='yes')cp*=2;s+=cp;

function calcNIHSS(v){
 const keys=['loc','locq','locc','gaze','visual','facial','armL','armR','legL','legR','ataxia','sensory','language','dysarthria','extinction'];
 if(keys.some(k=>v[k]===null||v[k]===undefined||v[k]===''))return null;
 const total=keys.reduce((a,k)=>a+Number(v[k]),0);
 return {value:total,unit:'/42',badge:total>=21?'Severe':total>=6?'Moderate':total>=1?'Minor':'No measurable deficit',badgeClass:total>=21?'danger':total>=6?'warn':'',breakdown:keys.map(k=>({label:k,value:v[k]})),formula:'NIHSS is the sum of the 15 standard neurologic domains; bedside definitions and scoring conventions must be followed exactly.'};
}
function calcASCVD(v){
 const age=Number(v.age),tc=Number(v.tc),hdl=Number(v.hdl),sbp=Number(v.sbp);
 if(![age,tc,hdl,sbp].every(Number.isFinite)||age<40||age>79||tc<=0||hdl<=0||sbp<=0)return null;
 const la=Math.log(age),lt=Math.log(tc),lh=Math.log(hdl),ls=Math.log(sbp),sm=v.smoker?1:0,dm=v.dm?1:0,tr=v.treated?1:0;
 let sum,mean,base;
 if(v.sex==='m'){
  sum=12.344*la+11.853*lt-2.664*la*lt-7.990*lh+1.769*la*lh+(tr?1.797:1.764)*ls+7.837*sm-1.795*la*sm+0.658*dm;
  mean=61.18;base=.9144;
 }else{
  sum=-29.799*la+4.884*la*la+13.540*lt-3.114*la*lt-13.578*lh+3.149*la*lh+(tr?2.019:1.957)*ls+7.574*sm-1.665*la*sm+0.661*dm;
  mean=-29.18;base=.9665;
 }
 const risk=(1-Math.pow(base,Math.exp(sum-mean)))*100;
 return {value:Math.max(0,Math.min(100,risk)).toFixed(1)+'%',unit:'estimated 10-year ASCVD risk',badge:'2013 Pooled Cohort Equation',badgeClass:risk>=20?'danger':risk>=7.5?'warn':'',formula:'2013 ACC/AHA Pooled Cohort Equation for White/other adults 40–79 years; sex-specific coefficients and treated/untreated SBP terms are used.'};
}

function normalizeSearch(s){return String(s||'').toLocaleLowerCase().normalize('NFKC').replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ًٌٍَُِّْـ]/g,'').replace(/[^\p{L}\p{N}+#.-]+/gu,' ').trim()}
function matchesQuery(x,q){if(!q)return true;const aliases={cha2ds2vasc:'chads vasc af stroke',wells_pe:'pulmonary embolism pe',wells_dvt:'deep vein thrombosis dvt',gcs:'glasgow coma glasgow coma scale',heart:'chest pain acute coronary syndrome',egfr_ckd:'kidney renal gfr',bsa:'body surface area',anc:'absolute neutrophil count neutrophil',qtc:'qt correction corrected qt',abg:'blood gas arterial blood gas',peds_gfr:'pediatric kidney renal',nihss:'stroke neurologic deficit',map:'mean arterial pressure',bun_cr:'bun creatinine ratio',pf_ratio:'pao2 fio2',sofa:'organ failure sepsis',qsofa:'sepsis quick sofa'};const hay=normalizeSearch([x.en,x.ar,x.descEn,x.descAr,aliases[x.id]||'',catName(catById(x.cat))].join(' '));const query=normalizeSearch(q);if(!query)return true;return query.split(/\s+/).filter(Boolean).every(t=>hay.includes(t))}
function levenshtein(a,b){a=normalizeSearch(a);b=normalizeSearch(b);if(a===b)return 0;if(!a)return b.length;if(!b)return a.length;let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[b.length]}
function searchScore(x,q){const query=normalizeSearch(q),compact=query.replace(/\s+/g,'');if(!query)return 0;const aliases={cha2ds2vasc:'chads vasc af stroke',wells_pe:'pulmonary embolism pe',wells_dvt:'deep vein thrombosis dvt',gcs:'glasgow coma glasgow coma scale',heart:'chest pain acute coronary syndrome',egfr_ckd:'kidney renal gfr',bsa:'body surface area',anc:'absolute neutrophil count neutrophil',qtc:'qt correction corrected qt',abg:'blood gas arterial blood gas',peds_gfr:'pediatric kidney renal',nihss:'stroke neurologic deficit',map:'mean arterial pressure',bun_cr:'bun creatinine ratio',pf_ratio:'pao2 fio2',sofa:'organ failure sepsis',qsofa:'sepsis quick sofa'};const fields=[x.en,x.ar,x.descEn,x.descAr,aliases[x.id]||'',catName(catById(x.cat))].map(normalizeSearch);let score=0;for(const token of query.split(/\s+/).filter(Boolean)){let best=0;for(const field of fields){if(field===token)best=Math.max(best,100);else if(field.startsWith(token))best=Math.max(best,85);else if(field.includes(token))best=Math.max(best,70);else if(token.length>=3){for(const word of field.split(/\s+/)){if(word&&levenshtein(token,word)<=Math.max(1,Math.floor(token.length/4)))best=Math.max(best,45)}}}if(!best)return 0;score+=best}if(compact.length>=2&&fields.join(' ').replace(/\s+/g,'').includes(compact))score+=25;return score}
function filterTools(q){const query=normalizeSearch(q);if(!query)return TOOLS.slice();return TOOLS.map(x=>({x,score:searchScore(x,query)})).filter(o=>o.score>0).sort((a,b)=>b.score-a.score).map(o=>o.x)}

 if(f.type==='check')return `<label class="pd-check"><input type="checkbox" id="${id}" data-field="${f.id}"><span>${esc(label)}</span></label>`;
 if(f.type==='radio')return `<fieldset class="pd-radio-group"><legend>${esc(label)}</legend><div class="pd-radio-grid">${(f.options||[]).map(o=>`<label class="pd-radio-card"><input type="radio" name="${id}" value="${esc(o.v)}" data-field="${f.id}"><span>${esc(lang==='ar'?o.ar:o.en)}</span></label>`).join('')}</div></fieldset>`;
 if(f.type==='select')return `<div class="pd-field"><label for="${id}">${esc(label)}</label><select id="${id}" data-field="${f.id}"><option value="">${esc(lang==='ar'?'اختر...':'Select...')}</option>${(f.options||[]).map(o=>`<option value="${esc(o.v)}">${esc(lang==='ar'?o.ar:o.en)}</option>`).join('')}</select></div>`;
 if(f.type==='text')return `<div class="pd-field"><label for="${id}">${esc(label)}</label><input type="text" id="${id}" data-field="${f.id}"></div>`;
 return `<div class="pd-field"><label for="${id}">${esc(label)}${f.unit?` <span style="opacity:.7;font-weight:600">(${esc(f.unit)})</span>`:''}</label><input type="number" id="${id}" data-field="${f.id}" inputmode="decimal" ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''} step="${f.step||'any'}"></div>`;
}
function buildToolForm(x){
 if(x.external)return `<div class="pd-result" style="margin-top:0"><div class="pd-result-label">${esc(t('check_interaction'))}</div><div class="pd-result-value" style="font-size:1.45rem">Medscape</div><p class="pd-disclaimer">${esc(t('external_note'))}</p><button type="button" class="pd-btn pd-btn-primary" id="open-medscape"><i class="fa-solid fa-arrow-up-right-from-square"></i> ${esc(t('open_medscape'))}</button></div><p class="pd-disclaimer">${esc(t('disclaimer'))}</p>`;
 let h=`<div id="tool-fields">`;
 (x.fields||[]).forEach(f=>h+=fieldHTML(f));
 h+=`</div><div id="tool-message" class="pd-validation"></div><div id="tool-result"></div><p class="pd-disclaimer">${esc(t('disclaimer'))}</p>`;
 return h;
}
function readFields(x){
 const v={};(x.fields||[]).forEach(f=>{if(f.type==='radio'){const e=document.querySelector(`input[name="f-${f.id}"]:checked`);v[f.id]=e?(e.value==='yes'?true:e.value==='no'?false:e.value):null}else{const e=document.getElementById('f-'+f.id);if(!e)return;if(f.type==='check')v[f.id]=e.checked;else if(f.type==='number')v[f.id]=e.value===''?null:Number(e.value);else v[f.id]=e.value}});return v;
}
function validate(x,v){
 for(const f of x.fields||[]){if(f.required&&(v[f.id]===null||v[f.id]===undefined||v[f.id]===''))return t('required');if(f.type==='number'&&v[f.id]!==null&&(!Number.isFinite(v[f.id])||(f.min!==undefined&&v[f.id]<f.min)||(f.max!==undefined&&v[f.id]>f.max)))return t('invalid')}
 return '';
}
function fillSample(x){(x.fields||[]).forEach(f=>{if(!x.sample||x.sample[f.id]===undefined)return;const val=x.sample[f.id];if(f.type==='radio'){const e=document.querySelector(`input[name="f-${f.id}"][value="${CSS.escape(String(val))}"]`);if(e)e.checked=true}else{const e=document.getElementById('f-'+f.id);if(e){if(f.type==='check')e.checked=!!val;else e.value=val}}});runCalc(x)}
function resetForm(x){(x.fields||[]).forEach(f=>{if(f.type==='radio')document.querySelectorAll(`input[name="f-${f.id}"]`).forEach(e=>e.checked=false);else{const e=document.getElementById('f-'+f.id);if(e){if(f.type==='check')e.checked=false;else e.value=''}}});document.getElementById('tool-result').innerHTML='';document.getElementById('tool-message').textContent='';const br=document.getElementById('bottom-result-value');if(br)br.textContent='—'}
function renderResult(r){
 const box=document.getElementById('tool-result');if(!r){box.innerHTML='';return}
 const bd=(r.breakdown||[]).map(x=>`<div class="pd-break-row"><span>${esc(x.label)}</span><strong>${esc(x.value)}</strong></div>`).join('');
 box.innerHTML=`<div class="pd-result"><div class="pd-result-label">${esc(t('result'))}</div><div class="pd-result-value">${esc(r.value)}</div><div class="pd-result-unit">${esc(r.unit||'')}</div>${r.badge?`<div class="pd-result-badge ${r.badgeClass||''}">${esc(r.badge)}</div>`:''}${bd?`<div class="pd-breakdown"><div class="pd-section-title">${esc(t('breakdown'))}</div>${bd}</div>`:''}${r.formula?`<div class="pd-formula"><strong>${esc(t('formula'))}:</strong> ${esc(r.formula)}</div>`:''}</div>`;
  const br=document.getElementById('bottom-result-value');if(br)br.textContent=[r.value,r.unit||''].filter(Boolean).join(' ');
}
function runCalc(x){
 if(x.external)return;
 const v=readFields(x),msg=validate(x,v),m=document.getElementById('tool-message');
 if(msg){m.textContent=msg;document.getElementById('tool-result').innerHTML='';return}
 try{const r=x.calc(v);renderResult(r);m.textContent=''}catch(err){console.error('PALDOSE calculator',x.id,err);m.textContent=t('invalid');document.getElementById('tool-result').innerHTML=''}
}
function bindToolForm(x){
 if(x.external){document.getElementById('open-medscape').onclick=()=>window.open('https://reference.medscape.com/drug-interactionchecker','_blank','noopener,noreferrer');return}
 const calcBtn=document.getElementById('btn-calc-fixed'),resetBtn=document.getElementById('btn-reset-fixed');
 if(calcBtn)calcBtn.onclick=()=>runCalc(x);
 if(resetBtn)resetBtn.onclick=()=>resetForm(x);
 document.querySelectorAll('#tool-fields input,#tool-fields select').forEach(e=>{e.addEventListener('input',()=>runCalc(x));e.addEventListener('change',()=>runCalc(x))});
 const shared={age:document.getElementById('pu-age')?.value,weight:document.getElementById('pu-wt')?.value,height:document.getElementById('pu-ht')?.value,creat:document.getElementById('pu-cr')?.value};
 (x.fields||[]).forEach(f=>{if(f.type==='number'&&shared[f.id]){const e=document.getElementById('f-'+f.id);if(e&&!e.value)e.value=shared[f.id]}});
 runCalc(x);
}
function openTool(id){const x=toolById(id);if(!x)return;hideSearchSuggestions();activeToolId=id;pushRecent(id);document.getElementById('sheet-title').textContent=nameOf(x);document.getElementById('sheet-sub').textContent=descOf(x);updateSheetStar();document.getElementById('sheet-body').innerHTML=buildToolForm(x);const br=document.getElementById('bottom-result-value');if(br)br.textContent='—';document.getElementById('tool-sheet').classList.add('open');document.body.classList.add('tool-open');bindToolForm(x);renderRecent()}
function updateSheetStar(){document.getElementById('sheet-star').classList.toggle('is-fav',isFav(activeToolId))}
function closeSheet(){document.getElementById('tool-sheet').classList.remove('open');document.body.classList.remove('tool-open');activeToolId=null}

document.getElementById('lang-en').onclick=()=>setLang('en');
document.getElementById('lang-ar').onclick=()=>setLang('ar');
document.getElementById('btn-theme').onclick=()=>setTheme(theme==='dark'?'light':'dark');
document.getElementById('list-back').onclick=()=>{showView('view-home');currentList={type:'home'}};
document.getElementById('sheet-close').onclick=closeSheet;
document.getElementById('tool-sheet').onclick=e=>{if(e.target.id==='tool-sheet')closeSheet()};
document.getElementById('sheet-star').onclick=()=>{if(activeToolId)toggleFav(activeToolId)};
document.getElementById('btn-favorites').onclick=openFavoritesList;
document.getElementById('recent-clear').onclick=()=>{recent=[];saveRecent();renderRecent()};
document.getElementById('list-search').oninput=renderListView;
document.getElementById('search-input').oninput=e=>{const q=e.target.value.trim();showView('view-home');currentList={type:'home'};renderSearchSuggestions(q)};
document.getElementById('power-recommend').onclick=()=>{const age=Number(document.getElementById('pu-age').value)||0,rec=[];if(age||document.getElementById('pu-wt').value||document.getElementById('pu-cr').value)rec.push('cockcroft','egfr_ckd','bmi');if(age>=65)rec.push('cha2ds2vasc','hasbled');rec.push('qtc','map','abg');const ids=[...new Set(rec)].slice(0,6);currentList={type:'search'};document.getElementById('list-title').textContent=t('recommended');document.getElementById('list-subtitle').textContent=ids.length+' '+t('tools_count');document.getElementById('list-search').value='';const l=document.getElementById('list-tools');l.innerHTML=ids.map(id=>toolById(id)).filter(Boolean).map(toolRowHTML).join('');bindToolRows(l);document.getElementById('list-empty').classList.add('hidden');showView('view-list')};
document.addEventListener('click',e=>{if(!e.target.closest('#global-search'))hideSearchSuggestions()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('search-suggestions')?.classList.contains('open'))hideSearchSuggestions();else closeSheet()}});
setTheme(theme);setLang(lang);renderAll();
})();
</script>
</body>
</html>
