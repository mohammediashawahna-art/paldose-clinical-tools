  "lab-data/engine.js": `(function(){
  'use strict';

  function normalize(str) {
    if (!str) return '';
    const arabicIndic = '٠١٢٣٤٥٦٧٨٩';
    let s = String(str).replace(/[٠-٩]/g, d => arabicIndic.indexOf(d));
    s = s.toLowerCase()
      .replace(/[أإآ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/[^a-z0-9\\u0600-\\u06ff\\s]/g, ' ')
      .replace(/\\s+/g, ' ')
      .trim();
    return s;
  }

  function getCustomSynonyms() {
    try { return JSON.parse(localStorage.getItem('paldose_lab_custom_synonyms') || '{}'); }
    catch(e) { return {}; }
  }

  function rememberTestName(rawLabel, testId) {
    const norm = normalize(rawLabel);
    if (!norm || !testId) return;
    const map = getCustomSynonyms();
    map[norm] = testId;
    localStorage.setItem('paldose_lab_custom_synonyms', JSON.stringify(map));
  }

  function findTestByLine(rawLine) {
    const db = window.LabTestsDb || [];
    const normLine = normalize(rawLine);
    if (!normLine) return null;

    // 1. Check custom user-remembered synonyms
    const custom = getCustomSynonyms();
    for (const [syn, id] of Object.entries(custom)) {
      if (normLine.includes(syn)) {
        const found = db.find(t => t.id === id);
        if (found) return Object.assign({}, found, { confidence: 1.0, matchedBy: 'custom' });
      }
    }

    // 2. Check HbA1c before Hb to avoid trap
    const orderedDb = db.slice().sort((a, b) => (a.id === 'hba1c' ? -1 : b.id === 'hba1c' ? 1 : 0));
    for (const test of orderedDb) {
      for (const syn of test.synonyms) {
        const normSyn = normalize(syn);
        if (!normSyn) continue;
        const regex = new RegExp('(^|\\\\s)' + normSyn.replace(/[.*+?^\${}()|[\\]\\\\]/g, '\\\\$&') + '(\\\\s|$)');
        if (regex.test(normLine)) {
          return Object.assign({}, test, { confidence: 0.95, matchedBy: syn });
        }
      }
    }
    return null;
  }

  function convertUnit(testObj, value, fromUnit) {
    if (value == null || isNaN(value)) return null;
    let num = Number(value);
    if (!testObj) return { canonicalValue: num, canonicalUnit: fromUnit || '' };
    // Handle platelets written as 250000
    if (testObj.id === 'platelets' && num > 2000 && (!fromUnit || fromUnit === 'x10^3/uL')) {
      num = num * 0.001;
    }
    const uEntry = (testObj.units || []).find(u => u.unit.toLowerCase() === String(fromUnit || testObj.canonicalUnit).toLowerCase());
    const factor = uEntry ? uEntry.factor : 1;
    return {
      canonicalValue: Number((num * factor).toFixed(3)),
      canonicalUnit: testObj.canonicalUnit,
      factor: factor
    };
  }

  function pickReference(testObj, patient, reportLow, reportHigh, unitFactor) {
    const f = unitFactor || 1;
    if (reportLow != null && reportHigh != null && !isNaN(reportLow) && !isNaN(reportHigh) && Number(reportLow) < Number(reportHigh)) {
      return { low: Number((reportLow * f).toFixed(2)), high: Number((reportHigh * f).toFixed(2)), source: 'Report' };
    }
    if (!testObj || !Array.isArray(testObj.ranges)) return { low: null, high: null, source: 'None' };
    const ageDays = (patient && patient.ageDays != null) ? patient.ageDays : 10950;
    const sex = (patient && patient.sex) || 'm';
    const match = testObj.ranges.find(r => ageDays >= r.ageMinDays && ageDays <= r.ageMaxDays && (r.sex === sex || r.sex === 'any'));
    if (match) return { low: match.low, high: match.high, source: 'Database' };
    return { low: null, high: null, source: 'None' };
  }

  function flagValue(canonicalVal, ref, critical) {
    if (canonicalVal == null || isNaN(canonicalVal)) return 'unknown';
    if (critical) {
      if (critical.low != null && canonicalVal <= critical.low) return 'critical_low';
      if (critical.high != null && canonicalVal >= critical.high) return 'critical_high';
    }
    if (ref && ref.low != null && ref.high != null) {
      if (canonicalVal < ref.low) return 'low';
      if (canonicalVal > ref.high) return 'high';
      return 'normal';
    }
    return 'normal';
  }

  function analyzeRecord(record) {
    const db = window.LabTestsDb || [];
    const patient = record.patient || { ageDays: 10950, sex: 'm', weight: 70, height: 170 };
    const outTests = {};

    for (const [testId, entry] of Object.entries(record.results || {})) {
      if (!entry || entry.value === '' || entry.value == null || isNaN(entry.value)) continue;
      const testObj = db.find(t => t.id === testId);
      if (!testObj) continue;
      const conv = convertUnit(testObj, parseFloat(entry.value), entry.unit || testObj.canonicalUnit);
      const ref = pickReference(testObj, patient, entry.refLow, entry.refHigh, conv.factor);
      const flag = flagValue(conv.canonicalValue, ref, testObj.critical);
      outTests[testId] = {
        id: testId,
        testName: testObj.name,
        value: conv.canonicalValue,
        unit: conv.canonicalUnit,
        originalValue: entry.value,
        originalUnit: entry.unit || testObj.canonicalUnit,
        refLow: ref.low != null ? ref.low : '—',
        refHigh: ref.high != null ? ref.high : '—',
        refSource: ref.source,
        flag: flag
      };
    }

    // Derive BUN from Urea if BUN is missing
    if (!outTests.bun && outTests.urea) {
      const derivedBun = Number((outTests.urea.value / 2.14).toFixed(1));
      const bunObj = db.find(t => t.id === 'bun');
      const ref = pickReference(bunObj, patient, null, null, 1);
      outTests.bun = {
        id: 'bun', testName: 'BUN (Derived from Urea)', value: derivedBun, unit: 'mg/dL',
        refLow: ref.low, refHigh: ref.high, refSource: 'Derived', flag: flagValue(derivedBun, ref, bunObj && bunObj.critical)
      };
    }

    return { patient: patient, tests: outTests };
  }

  function evaluateFollowup(analyzed) {
    const rules = window.LabFollowupDb || [];
    const tests = analyzed.tests || {};
    const triggered = [];

    for (const r of rules) {
      const checkCond = (c) => {
        const t = tests[c.test];
        if (!t) return false;
        if (c.flag === 'low') return t.flag === 'low' || t.flag === 'critical_low';
        if (c.flag === 'high') return t.flag === 'high' || t.flag === 'critical_high';
        return t.flag === c.flag;
      };
      let match = false;
      if (r.when && Array.isArray(r.when.all)) match = r.when.all.every(checkCond);
      else if (r.when && Array.isArray(r.when.any)) match = r.when.any.some(checkCond);
      if (match) triggered.push(r);
    }
    const order = { urgent: 0, important: 1, info: 2 };
    return triggered.sort((a, b) => (order[a.severity] || 9) - (order[b.severity] || 9));
  }

  window.LabEngine = { normalize, rememberTestName, findTestByLine, convertUnit, pickReference, flagValue, analyzeRecord, evaluateFollowup };
})();`,

  "lab-data/scores.js": `(function(){

        if (a.patient.ageDays >= 6570) out.age = Math.round(a.patient.ageDays / 365.25);
        if (a.patient.sex) out.sex = a.patient.sex;
        return a.tests.creatinine ? out : {};
      }
    },
    {
      id: 'cockcroft', name: 'Cockcroft-Gault CrCl', totalCount: 4,

        const out = {};
        if (a.tests.bili_total) out.bili = a.tests.bili_total.value;
        if (a.tests.inr) out.inr = a.tests.inr.value;
        if (a.tests.creatinine) out.creat = a.tests.creatinine.value;

      id: 'child_pugh', name: 'Child-Pugh Score', totalCount: 5,

    const list = [];
    for (const s of SCORE_DEFINITIONS) {
      const vals = s.extract(analyzed);
      const count = Object.keys(vals).length;
      if (count > 0) {
        list.push({ id: s.id, name: s.name, availableCount: Math.min(count, s.totalCount), totalCount: s.totalCount, prefill: vals });
      }
    }
    return list;
  }

  function getPrefillValues(toolId, analyzed) {
    const def = SCORE_DEFINITIONS.find(s => s.id === toolId);
    return def ? def.extract(analyzed) : {};
  }

  window.LabScores = { SCORE_DEFINITIONS, getAvailableScores, getPrefillValues };
})();`,

  "lab-data/ocr.js": `(function(){
  'use strict';

  window.LabOCR = {
    isLoaded: false,
    async loadTesseract() {
      if (this.isLoaded || window.Tesseract) { this.isLoaded = true; return; }
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';
        script.async = true;
        script.onload = () => { this.isLoaded = true; resolve(); };
        script.onerror = reject;
        document.head.appendChild(script);
      });
    },
    async processImage(file, useArabic, onProgress) {
      await this.loadTesseract();
      const blob = await this.downscaleImage(file, 1600);
      const langs = useArabic ? 'eng+ara' : 'eng';
      const worker = await window.Tesseract.createWorker(langs, 1, {
        logger: m => {
          if (m.status === 'recognizing text' && typeof onProgress === 'function') {
            onProgress(Math.round((m.progress || 0) * 100));
          }
        }
      });
      const ret = await worker.recognize(blob);
      await worker.terminate();
      return this.parseText(ret.data.text || '');
    },
    downscaleImage(file, maxDim) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            c.toBlob(b => resolve(b || file), 'image/jpeg', 0.85);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    },
    parseText(rawText) {
      const lines = String(rawText).split(/\\r?\\n/);
      const extracted = {};
      const rangeRegex = /(\\d+(?:[.,]\\d+)?)\\s*(?:-|–|to)\\s*(\\d+(?:[.,]\\d+)?)/i;
      const numRegex = /(\\d+(?:[.,]\\d+)?)/g;

      for (const line of lines) {
        const clean = line.replace(/,/g, '.').trim();
        if (clean.length < 3 || !window.LabEngine) continue;
        const matched = window.LabEngine.findTestByLine(clean);
        if (!matched) continue;

        let refLow = null, refHigh = null;
        const rMatch = clean.match(rangeRegex);
        if (rMatch) {
          refLow = parseFloat(rMatch[1]);
          refHigh = parseFloat(rMatch[2]);
        }
        const nums = clean.match(numRegex);
        if (nums && nums.length > 0) {
          const val = parseFloat(nums[0]);
          if (!isNaN(val)) {
            extracted[matched.id] = {
              value: val,
              unit: matched.canonicalUnit,
              refLow: refLow,
              refHigh: refHigh,
              rawLine: clean,
              confidence: matched.confidence || 0.85
            };
          }
        }
      }
      return extracted;
    }
  };
})();`,

  "lab-data/lab-app.js": `(function(){

          </div>
          <div id="ocr-progress-bar" class="text-xs font-bold text-emerald-600 hidden"></div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
            <div>
              <label class="block text-[11px] font-bold text-slate-500">Age (Years)</label>
              <input type="number" id="lab-pat-age" value="30" class="w-full h-9 px-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent text-xs font-bold" onchange="updateLabPatient()"/>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-500">Sex</label>
              <select id="lab-pat-sex" class="w-full h-9 px-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent text-xs font-bold" onchange="updateLabPatient()">
                <option value="m">Male / ذكر</option>
                <option value="f">Female / أنثى</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-500">Weight (kg)</label>
              <input type="number" id="lab-pat-wt" value="70" class="w-full h-9 px-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-transparent text-xs font-bold" onchange="updateLabPatient()"/>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-slate-500">Case Label</label>

  window.handleLabOcrUpload = async function(file) {

    if (prog) { prog.classList.remove('hidden'); prog.textContent = 'Running OCR... 0%'; }

  window.loadSampleLabData = function() {

      hb: { value: 9.2, unit: 'g/dL' }, mcv: { value: 71, unit: 'fL' },

    currentLabRecord.results = {};
    renderLabInputs();
    refreshLabAnalysis();
  };

  window.saveCurrentLabHistory = function() {
    const list = JSON.parse(localStorage.getItem('paldose_lab_history') || '[]');
    list.unshift({ ts: Date.now(), patient: currentLabRecord.patient, results: currentLabRecord.results });

  function renderLabInputs() {
    const form = document.getElementById('lab-entry-form');
    if (!form || !window.LabTestsDb) return;
    const panels = ['cbc', 'renal', 'electrolytes', 'liver', 'lipids', 'other'];

    }).join('');

  window.onLabValInput = function(testId, val) {
    const num = parseFloat(val);
    if (isNaN(num) || String(val).trim() === '') delete currentLabRecord.results[testId];
    else {
      const t = window.LabTestsDb.find(x => x.id === testId);
      currentLabRecord.results[testId] = { value: num, unit: t ? t.canonicalUnit : '' };
    }
    refreshLabAnalysis();
  };

  function refreshLabAnalysis() {
    const resBox = document.getElementById('lab-analysis-results');
    const scBox = document.getElementById('lab-scores-container');
    if (!resBox || !window.LabEngine) return;

    const analyzed = window.LabEngine.analyzeRecord(currentLabRecord);
    const items = Object.values(analyzed.tests || {});
    const rules = window.LabEngine.evaluateFollowup(analyzed);

    let html = '<div class="pd-card p-4 space-y-3"><h3 class="text-sm font-extrabold">Reviewed Findings & Flags</h3>';
    if (!items.length) {
      html += '<p class="text-xs text-slate-500">Enter lab values or upload a report image to view analysis.</p>';
    } else {
      html += '<div class="space-y-1.5">' + items.map(it => \`
        <div class="flex items-center justify-between p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-bold">
          <span>\${it.testName}</span>
          <span>\${it.value} \${it.unit} <small class="text-slate-400">(\${it.refLow}–\${it.refHigh} • \${it.refSource})</small></span>
          <span class="uppercase px-2 py-0.5 rounded-full text-[10px] \${it.flag === 'normal' ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-100 text-rose-700'}">\${it.flag}</span>
        </div>
      \`).join('') + '</div>';
    }
    html += '</div>';

    if (rules.length) {
      html += '<div class="pd-card p-4 space-y-2"><h3 class="text-sm font-extrabold text-amber-600">Suggested Next Steps (Rule Layer)</h3>';
      html += rules.map(r => \`
        <div class="p-3 rounded-xl border border-amber-300/60 bg-amber-50/40 dark:bg-amber-950/20 text-xs space-y-1">
          <div class="font-extrabold">[\${r.severity.toUpperCase()}] \${document.documentElement.lang === 'ar' ? r.reasonAr : r.reasonEn}</div>
          <div class="text-[10px] text-slate-500">Source: \${r.source}</div>
        </div>
      \`).join('') + '</div>';
    }
    html += '<p class="pd-disclaimer">Educational and clinical decision-support tool. Always verify calculations and apply clinical judgment.</p>';
    resBox.innerHTML = html;

    if (scBox && window.LabScores) {
      const avail = window.LabScores.getAvailableScores(analyzed);
      scBox.innerHTML = avail.length ? avail.map(s => \`
        <div class="p-3 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-between gap-2">
          <div>
            <div class="text-xs font-extrabold">\${s.name}</div>
            <div class="text-[10px] text-emerald-600 font-bold">\${s.availableCount}/\${s.totalCount} from report</div>
          </div>
          <button class="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-extrabold" onclick="openPrefilledScore('\${s.id}')">Open</button>
        </div>
      \`).join('') : '<p class="text-xs text-slate-500">Enter renal, electrolyte, liver, or CBC values to unlock matching calculators.</p>';
    }
  }

  window.openPrefilledScore = function(toolId) {
    const analyzed = window.LabEngine.analyzeRecord(currentLabRecord);
    const vals = window.LabScores.getPrefillValues(toolId, analyzed);
    if (typeof window.openToolWithValues === 'function') window.openToolWithValues(toolId, vals);
    else if (typeof window.openTool === 'function') window.openTool(toolId);
  };
})();`,

  "worker/lab-ai-worker.js": `const AI_MODEL = '@cf/meta/llama-3.1-8b-instruct';
const MAX_USER_CALLS_PER_DAY = 2;
const DEFAULT_GLOBAL_CAP = 150;

export default {
  async fetch(request, env) {
    const origin = request.headers.get('Origin') || '';
    const allowedOrigin = env.ALLOWED_ORIGIN || 'https://pomodorox.mohammed-i-a-shawahna.workers.dev';
    const corsHeaders = {
      'Access-Control-Allow-Origin': allowedOrigin,
      'Access-Control-Allow-Methods': 'POST, OPTIONS',
      'Access-Control-Allow-Headers': 'Content-Type, Authorization'
    };

    if (request.method === 'OPTIONS') return new Response(null, { headers: corsHeaders });
    if (request.method !== 'POST') return new Response('Method Not Allowed', { status: 405, headers: corsHeaders });

    try {
      const authHeader = request.headers.get('Authorization') || '';
      const token = authHeader.replace(/^Bearer\\s+/i, '').trim();
      if (!token) {
        return Response.json({ error: 'Available with a free account' }, { status: 401, headers: corsHeaders });
      }

      const today = new Date().toISOString().slice(0, 10);
      const globalKey = \`ai:global:\${today}\`;
      const globalCount = parseInt((await env.LAB_AI_KV.get(globalKey)) || '0', 10);
      const globalCap = parseInt(env.GLOBAL_DAILY_CAP || String(DEFAULT_GLOBAL_CAP), 10);
      if (globalCount >= globalCap) {
        return Response.json({ error: 'Global daily limit reached. Layer-1 rules still apply.' }, { status: 429, headers: corsHeaders });
      }

      const userKey = \`ai:\${token.slice(0, 36)}:\${today}\`;
      const userCount = parseInt((await env.LAB_AI_KV.get(userKey)) || '0', 10);
      if (userCount >= MAX_USER_CALLS_PER_DAY) {
        return Response.json({ remaining: 0, error: 'Daily limit of 2 AI summaries reached.' }, { status: 429, headers: corsHeaders });
      }

      const payload = await request.json();
      const prompt = \`You are a clinical decision-support assistant. Never diagnose. Use only provided values. Return strict JSON: {"summary":"","considerations":[{"text":"","basedOn":[]}],"suggestedTests":[],"caveat":"AI-generated, verify before use."}. Data: \${JSON.stringify(payload)}\`;

      const aiRes = await env.AI.run(AI_MODEL, { prompt, temperature: 0.1, max_tokens: 400 });
      const parsed = JSON.parse(aiRes.response || '{}');
      if (!parsed.summary || !Array.isArray(parsed.considerations)) {
        return Response.json({ error: 'Invalid AI schema output; usage not counted.' }, { status: 502, headers: corsHeaders });
      }

      await env.LAB_AI_KV.put(userKey, String(userCount + 1), { expirationTtl: 172800 });
      await env.LAB_AI_KV.put(globalKey, String(globalCount + 1), { expirationTtl: 172800 });

      return Response.json({
        remaining: MAX_USER_CALLS_PER_DAY - (userCount + 1),
        resetAtUTC: today + 'T24:00:00Z',
        data: parsed
      }, { headers: corsHeaders });
    } catch (err) {
      return Response.json({ error: 'Processing error without counting usage.' }, { status: 500, headers: corsHeaders });
    }
  }
};`
};

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function downloadAllAsZip() {
  const statusEl = document.getElementById('status');
  try {
    const zip = new JSZip();
    for (const [filepath, content] of Object.entries(FILES)) {
      zip.file(filepath, content);
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    downloadBlob(blob, 'paldose-lab-analyzer.zip');
    statusEl.textContent = '✅ تم تنزيل ملف paldose-lab-analyzer.zip بنجاح!';
  } catch (e) {
    statusEl.textContent = 'يمكنك تنزيل كل ملف مباشرة من الأزرار أعلاه.';
  }
}

const btnContainer = document.getElementById('file-buttons');
for (const [filepath, content] of Object.entries(FILES)) {
  const btn = document.createElement('button');
  btn.className = 'btn-file';
  btn.innerHTML = `<span>📄 ${filepath}</span><span>⬇️</span>`;
  btn.onclick = () => {
    const blob = new Blob([content], { type: 'application/octet-stream' });
    downloadBlob(blob, filepath.split('/').pop());
  };
  btnContainer.appendChild(btn);
}

document.getElementById('dl-zip').onclick = downloadAllAsZip;
window.addEventListener('load', () => setTimeout(downloadAllAsZip, 400));
</script>
