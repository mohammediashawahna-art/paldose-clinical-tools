w-9{width:30px;height:30px;font-size:12px}.pd-power .text-sm{font-size:12px}.pd-power .text-\[11px\]{font-size:9px}.pd-power-grid{gap:6px}.pd-power-field input{height:36px;font-size:12px}.pd-power .pd-btn{height:38px;font-size:12px}.pd-tools-grid{display:grid;grid-template-columns:1fr;gap:8px}.pd-tool-card{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 12px;border:1px solid var(--pd-border);border-radius:14px;background:var(--pd-card);cursor:pointer;text-align:start;box-shadow:0 2px 8px rgba(15,23,42,.035)}.pd-tool-card-icon{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:var(--pd-bg);display:flex;align-items:center;justify-content:center;color:#059669;font-size:15px}.pd-tool-card-name{font-size:12px;font-weight:800;line-height:1.25}.pd-tool-card-desc{font-size:9px;font-weight:600;color:var(--pd-muted);margin-top:2px;line-height:1.25}.pd-tool-card .pd-tool-arrow{margin-inline-start:auto;color:var(--pd-muted);font-size:10px}@media(min-width:640px){.pd-search-results-grid,.pd-tools-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

<body>
<header class="pd-header">
<div class="pd-main px-4 py-3 flex items-center justify-between gap-3">
<div class="flex items-center gap-2.5 min-w-0">
<div class="pd-logo-mark">P</div>
<div class="min-w-0"><div class="pd-brand">PALDOSE</div><div class="pd-tagline" data-i18n="tagline">Better Decisions. Healthier Lives.</div></div>
</div>
<div class="flex items-center gap-2 shrink-0">
<button type="button" class="pd-icon-btn" id="btn-favorites" aria-label="Favorites" title="Favorites"><i class="fa-solid fa-star"></i></button>
<button type="button" class="pd-icon-btn" id="btn-theme" aria-label="Toggle theme"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
<div class="pd-lang-toggle" role="group" aria-label="Language">
<button type="button" id="lang-ar">عربي</button>
<button type="button" id="lang-en" class="active">EN</button>
</div>
</div>
</div>
</header>

<main class="pd-main px-4 pt-4">
<section id="view-home" class="view active">
<div class="pd-search-primary">
  <div class="pd-search-wrap pd-search-main"><i class="fa-solid fa-magnifying-glass pd-search-icon"></i><input type="search" id="search-input" class="pd-search" data-i18n-placeholder="search_placeholder" placeholder="Search for a tool..." autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search"/><button type="button" class="pd-search-action" id="search-clear" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="pd-search-hint" data-i18n="search_hint">Search by tool name, abbreviation, or clinical term</div>
  <div id="search-results" class="pd-search-results hidden"></div>
</div>

<div class="mb-4" id="recent-section">
<button type="button" class="pd-recent-toggle" id="recent-toggle"><span><i class="fa-regular fa-clock"></i> <span data-i18n="recent">Recent Tools</span></span><i class="fa-solid fa-chevron-down"></i></button>
<div class="pd-recent-panel" id="recent-panel"><div id="recent-list" class="pd-recent-rail"></div><div id="recent-empty" class="pd-empty hidden" data-i18n="recent_empty">No recent tools yet.</div><button type="button" class="pd-link" id="recent-clear" data-i18n="clear_all" style="margin-top:3px">Clear all</button></div>
</div>

<div class="pd-card pd-power p-4 mb-4">
<div class="flex items-center gap-2 mb-3">
<div class="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center"><i class="fa-solid fa-bolt"></i></div>
<div class="flex-1 min-w-0"><div class="font-extrabold text-sm" data-i18n="power_ui">Power UI</div><div class="text-[11px] font-semibold text-slate-500" data-i18n="power_ui_sub">Your clinical assistant, smarter.</div></div>
</div>

{id:'aado2',cat:'lab',icon:'fa-wind',en:'A-a Gradient',ar:'تدرج A-a',descEn:'Alveolar-arterial O₂',descAr:'تدرج الأكسجين',

{id:'osmolar_gap',cat:'lab',icon:'fa-vial',en:'Osmolar Gap',ar:'فجوة الأسمولية',descEn:'Toxic alcohol screen',descAr:'فحص الكحوليات السامة',

{id:'serum_osmo',cat:'lab',icon:'fa-flask',en:'Calculated Osmolality',ar:'الأسمولية المحسوبة',descEn:'2Na + gluc/18 + BUN/2.8',descAr:'معادلة الأسمولية',
